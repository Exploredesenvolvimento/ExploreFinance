  add(rows,"Lançamentos",[12,30,28,9,14,18,20,18,22,16,14,36,14]);add(fx,"Contas Fixas",[6,30,28,14,18,20,18,22,7]);add(bk,"Bancos",[24,18,18]);
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
  try{await downloads.save({filename:"Finance_"+today()+".xlsx",data:buf});}
  catch(x){if(x&&x.code!=="declined")toast("Não foi possível baixar agora");}
}

/* ---------- contas fixas: lançar os meses sozinho ---------- */
let genBusy=false,genAgain=false;
async function ensureFixas(){
  if(!S.canWrite||!S.lDef||!S.fDef||!S.db)return;
  if(genBusy){genAgain=true;return;}genBusy=true;S.sistema=true;
  try{
    const now=new Date(),[hy,hm]=addYM(now.getFullYear(),now.getMonth()+1,2),hKey=ymKey(hy,hm);
    for(const[fid,f]of S.F){
      if(f.ativa===false||!f.inicio||!(f.dia>=1))continue;
      let[y,m]=f.inicio.split("-").map(Number),guard=0;
      while(ymKey(y,m)<=hKey&&guard++<60){
        const k=ymKey(y,m),id="fx-"+fid+"-"+k;
        if(!S.L.has(id)){
          await S.db.doc("lancamentos/"+id).set({venc:dateFor(y,m,f.dia),credor:f.credor,plano:f.plano,tipo:tipoDe(f.plano),valor:f.valor,forma:f.forma||"",banco:f.banco||"",centro:f.centro||"",cartao:f.cartao||"",obs:f.obs||"",pago:null,origem:{t:"fixa",fixa:fid,mes:k},criado:new Date().toISOString()});
          S.L.set(id,{venc:dateFor(y,m,f.dia),credor:f.credor,plano:f.plano,tipo:tipoDe(f.plano),valor:f.valor,pago:null,origem:{t:"fixa",fixa:fid,mes:k}});
        }
        [y,m]=addYM(y,m,1);
      }
    }
  }catch(x){console.warn("fixas",x);}
  genBusy=false;S.sistema=false;if(genAgain){genAgain=false;ensureFixas();}
}

/* ---------- deslizar para pagar (toque) ---------- */
let gesto=null,ignoraClique=false;
view.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"||!S.canWrite)return;const it=e.target.closest(".item[data-id]");if(!it||!it.querySelector('[data-act="pay"]'))return;
  gesto={it,id:it.dataset.id,x:e.clientX,y:e.clientY,dx:0,on:false};
});
window.addEventListener("pointermove",e=>{if(!gesto)return;const dx=e.clientX-gesto.x,dy=e.clientY-gesto.y;
  if(!gesto.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){gesto=null;return;}if(dx>10&&dx>Math.abs(dy))gesto.on=true;else return;}
  gesto.dx=Math.max(0,Math.min(dx,160));gesto.it.classList.add("arrasta");gesto.it.style.transform=`translateX(${gesto.dx}px)`;gesto.it.classList.toggle("pronto",gesto.dx>90);});
const soltar=()=>{if(!gesto)return;const a=gesto;gesto=null;if(!a.on)return;ignoraClique=true;setTimeout(()=>ignoraClique=false,350);
  a.it.classList.remove("arrasta");a.it.classList.add("solta");a.it.style.transform="";
  if(a.dx>90){const l=S.L.get(a.id);if(!l)return;const bs=bancos(),banco=l.banco||(bs.length===1?bs[0]:"");
    if(bs.length&&!banco){openPay(a.id);return;}
    const antes={pago:l.pago||null,banco:l.banco||""};
    S.db.doc("lancamentos/"+a.id).update({pago:today(),banco}).then(()=>{S.pagoAgora={id:a.id,t:Date.now()};render(true);
      toast(isIn(l)?"Recebimento registrado":"Pagamento registrado",{fn:()=>S.db.doc("lancamentos/"+a.id).update(antes)});}).catch(x=>toast(writeErr(x)));}
  else a.it.classList.remove("pronto");};
window.addEventListener("pointerup",soltar);window.addEventListener("pointercancel",soltar);
view.addEventListener("click",e=>{if(ignoraClique){e.stopImmediatePropagation();e.preventDefault();}},true);
/* ---------- virada do dia com o app aberto ---------- */
let diaVisto=today();
function checarDia(){const t=today();if(t===diaVisto)return;const antes=diaVisto;diaVisto=t;
  if(ymKey(S.y,S.m)===ymOf(antes)){const n=new Date();S.y=n.getFullYear();S.m=n.getMonth()+1;}
  if(S.lReady&&S.fReady){render(true);ensureFixas();}}
setInterval(checarDia,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checarDia();});
/* ---------- conexão com os dados ---------- */
(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){S.offline=true;S.lReady=S.fReady=false;renderOffline();return;}
  S.db=comHistorico(db);
  const user=await window.claude?.use?.("user");
  try{const c=user&&await user.can("data.write");if(c===false)S.canWrite=false;}catch(_){}
  downloads=await window.claude?.use?.("downloads");
  try{const as=await window.claude?.use?.("assets");
    if(as){if(typeof as.upload==="function"&&S.canWrite)ANX.up=async f=>(await as.upload(f,{type:f.type})).id;
      ANX.del=id=>Promise.resolve(as.delete?as.delete(id):null).catch(()=>{});if(typeof as.urlFor==="function")ANX.url=id=>as.urlFor(id);}}catch(_){}
  db.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?{...DEFAULT_CFG,...s.data()}:null;S.cfgLoaded=true;if(S.tab!=="ajustes")render();},e=>console.warn(e));
  db.collection("lancamentos").onSnapshot(s=>{
    S.L=new Map(s.docs.map(d=>[d.id,d.data()]));
    S.lReady=true;if(!s.metadata.fromCache)S.lDef=true;
    render();if(!s.metadata.hasPendingWrites)setTimeout(ensureFixas,60);
  },e=>{console.warn(e);if(!S.lReady){S.offline=true;renderOffline();}});
  db.collection("dividas").onSnapshot(s=>{S.D=new Map(s.docs.map(d=>[d.id,d.data()]));if(S.tab==="pat")render();},e=>console.warn(e));
  db.collection("investimentos").onSnapshot(s=>{S.I=new Map(s.docs.map(d=>[d.id,d.data()]));if(S.tab==="pat")render();},e=>console.warn(e));
  db.collection("contatos").onSnapshot(s=>{S.C=new Map(s.docs.map(d=>[d.id,d.data()]));if(["contatos","contas"].includes(S.tab))render();},e=>console.warn(e));
  db.collection("historico").onSnapshot(s=>{S.H=new Map(s.docs.map(d=>[d.id,d.data()]));if(S.tab==="ajustes"){const el=document.getElementById("setHist");if(el)el.outerHTML=histSecao();}},e=>console.warn(e));
  db.collection("fixas").onSnapshot(s=>{
    S.F=new Map(s.docs.map(d=>[d.id,d.data()]));
    S.fReady=true;if(!s.metadata.fromCache)S.fDef=true;
    render();ensureFixas();
  },e=>console.warn(e));
})();
})();
