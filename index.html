<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Contas a pagar e a receber, contas fixas, cartões, extratos e relatórios da sua empresa.">
<meta name="theme-color" content="#612b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: menu lateral fixo (marca, navegação) + área de trabalho com barra de título; no celular o menu vira barra inferior.
   Visual de banco digital: fundo neutro quente, superfícies brancas só onde há lista, bordô reservado para ação e item ativo. */
:root{
  --bg:#f6f5f3; --side:#fbfaf8; --surface:#ffffff; --surface-2:#f3f1ee; --hover:#f7f5f2;
  --line:#e8e4df; --line-2:#d9d4ce; --fg:#18151a; --muted:#6c6670; --faint:#9b959e;
  --brand:#612b4a; --brand-ink:#ffffff; --brand-soft:#f3ebef; --brand-line:#e3cfd9;
  --pos:#127a49; --pos-soft:#e6f3ec; --late:#c0352b; --late-soft:#fbe9e7; --warn:#9a5b00; --warn-soft:#fbf0dc;
  --in:var(--pos); --out:var(--fg); --gold:#b58a4c;
  --bar-in:#2f8a5f; --bar-out:#612b4a;
  --c1:#612b4a; --c2:#3f6f8f; --c3:#b58a4c; --c4:#5b8a72; --c5:#a65d57; --c6:#7a6aa8; --c7:#c2919f; --c8:#8a8f98; --cx:#cfc9cc;
  --f-ui:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --side-w:240px; --shadow:0 1px 2px rgba(24,21,26,.04), 0 8px 24px rgba(24,21,26,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e10; --side:#131114; --surface:#18161a; --surface-2:#211e23; --hover:#1d1a1f;
  --line:#2a262c; --line-2:#3a353c; --fg:#f2eff2; --muted:#a49da6; --faint:#776f79;
  --brand:#d08cb0; --brand-ink:#1a1016; --brand-soft:#2a1b24; --brand-line:#4a2d3d;
  --pos:#4cc38a; --pos-soft:#14261d; --late:#ff7b6f; --late-soft:#2e1614; --warn:#f0b450; --warn-soft:#2b2010;
  --gold:#d6b07a; --bar-in:#4cc38a; --bar-out:#d08cb0;
  --c1:#d08cb0; --c2:#7fb0d1; --c3:#d6b07a; --c4:#8cc3a6; --c5:#e09a8f; --c6:#b0a3dd; --c7:#e7b8c6; --c8:#a7adb6; --cx:#4a444c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e10; --side:#131114; --surface:#18161a; --surface-2:#211e23; --hover:#1d1a1f;
  --line:#2a262c; --line-2:#3a353c; --fg:#f2eff2; --muted:#a49da6; --faint:#776f79;
  --brand:#d08cb0; --brand-ink:#1a1016; --brand-soft:#2a1b24; --brand-line:#4a2d3d;
  --pos:#4cc38a; --pos-soft:#14261d; --late:#ff7b6f; --late-soft:#2e1614; --warn:#f0b450; --warn-soft:#2b2010;
  --gold:#d6b07a; --bar-in:#4cc38a; --bar-out:#d08cb0;
  --c1:#d08cb0; --c2:#7fb0d1; --c3:#d6b07a; --c4:#8cc3a6; --c5:#e09a8f; --c6:#b0a3dd; --c7:#e7b8c6; --c8:#a7adb6; --cx:#4a444c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
.num,.amt{font-variant-numeric:tabular-nums}
button{font-family:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:18px;overflow:auto}
.org{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--fg);cursor:default}
.org-ic{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.02em;flex:none}
.org-tx{min-width:0;display:grid}
.org-tx b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-tx small{color:var(--muted);font-size:12px}
.side-nav{display:grid;gap:2px}
.side-nav .grp{font-size:11.5px;color:var(--faint);padding:14px 10px 6px;letter-spacing:.02em}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nv:hover{background:var(--hover);color:var(--fg)}
.nv[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
.nv[aria-selected="true"] svg.i{stroke:var(--brand)}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 10px}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.tb-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:18px 14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.tb-title{min-width:0;flex:1}
.tb-title h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.tb-title p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.month{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px}
.month button{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.month button:hover{background:var(--hover);color:var(--fg)}
.month span{min-width:118px;text-align:center;font-weight:500;font-size:13.5px;text-transform:capitalize}
main#view{max-width:1120px;width:100%;margin:0 auto;padding-block:6px 96px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:28px;align-content:start}
main#view>*{min-width:0}
.bottom{display:none}

/* ---------- tipografia e blocos ---------- */
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font-weight:500;font-size:13.5px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}

/* valores em reais */
.amt .cur{font-size:.55em;font-weight:500;color:var(--muted);margin-right:.3em;vertical-align:.45em;letter-spacing:0}
.amt .cts{font-size:.6em;color:var(--muted);font-weight:500}
.in{color:var(--pos)} .out{color:var(--fg)}

/* ---------- visão geral ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end}
.hero .k{font-size:13px;color:var(--muted)}
.hero .big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero .side-k{text-align:right}
.hero .side-k b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.hero .side-k small{color:var(--muted);font-size:12.5px}
.spark{position:relative;margin-top:14px}
.spark svg{display:block;width:100%;height:150px;overflow:visible}
.spark .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s}
.spark .tip b{font-weight:600}
.spark .lg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.spark .lg i{display:inline-block;width:14px;height:0;border-top:2px solid var(--brand);vertical-align:middle;margin-right:6px}
.spark .lg i.dash{border-top-style:dashed;opacity:.7}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{padding:16px 18px 16px 0;min-width:0}
.strip>div+div{padding-left:18px;border-left:1px solid var(--line)}
.strip .k{font-size:12.5px;color:var(--muted)}
.strip .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.strip .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.meter{height:4px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.alert{display:flex;gap:10px;align-items:center;background:var(--late-soft);color:var(--late);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:500}
.rank{display:grid}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
.rank .r:last-child{border-bottom:0}
.rank .r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rank .r .p{grid-column:1 / -1;height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rank .r .p i{display:block;height:100%;background:var(--brand);opacity:.85}
.rank .r .pc{font-size:12px;color:var(--muted);margin-left:8px}

/* ---------- listas de contas ---------- */
.list{display:grid}
.item{display:grid;grid-template-columns:36px minmax(0,1fr) 128px 132px 92px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.list>.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.item:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.item .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.02em}
.item.is-in .ic{background:var(--pos-soft);color:var(--pos)}
.item .ic.dt{display:grid;place-items:center;line-height:1.05;background:transparent;border:1px solid var(--line)}
.item .ic.dt b{font-size:14px;font-weight:600;color:var(--fg)}
.item .ic.dt small{font-size:10px;color:var(--muted);text-transform:uppercase}
.item .who{min-width:0}
.item .who b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .who span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.st-paga .dot{background:var(--pos)}
.st-atrasada .dot{background:var(--late)} .st-atrasada .st{color:var(--late);font-weight:500}
.st-hoje .dot,.st-breve .dot{background:var(--gold)} .st-hoje .st{color:var(--warn);font-weight:500}
.item .v{text-align:right;font-weight:500;font-size:14.5px;white-space:nowrap}
.item .act{display:flex;justify-content:flex-end}
.item.st-paga .v{color:var(--muted)}
.item.is-in.st-paga .v{color:var(--pos)}
.tag{font-size:12px;color:var(--muted)}
.dayh{display:flex;justify-content:space-between;gap:12px;padding:10px 16px 8px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:500}
.dayh:first-child{border-top:0}
.dayh span:first-child{color:var(--fg)}
.panel .empty{padding:44px 20px}

/* ---------- botões e campos ---------- */
.btn{font:500 13.5px var(--f-ui);border-radius:9px;padding:8px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--brand)}
.btn.pay{background:transparent;border-color:var(--line-2);color:var(--fg);padding:5px 10px}
.btn.pay:hover{border-color:var(--pos);color:var(--pos);background:var(--pos-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--late);border-color:var(--late-soft);background:transparent}
.btn.danger:hover{background:var(--late-soft);border-color:var(--late)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:10px;padding:3px}
.chip{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 11px;font:500 13px var(--f-ui);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{position:relative;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:34px;width:230px}
input,select,textarea{font:400 14.5px var(--f-ui);color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
input::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--fg)}
label.f .help{font-weight:400;font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:14px 12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1 / -1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.sum{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum b{color:var(--fg);font-weight:600;font-size:14px;margin-left:4px}

/* ---------- gaveta (janelas) ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,10,14,.36);display:flex;justify-content:flex-end;align-items:stretch}
.sheet{background:var(--surface);color:var(--fg);width:min(500px,100%);height:100%;overflow:auto;padding:22px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.sheet .hd{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.sheet .hd h3{flex:1;font-size:17px}
.sheet .actions{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:760px){.overlay{align-items:flex-end;justify-content:center}.sheet{height:auto;max-height:92%;width:100%;border-radius:18px 18px 0 0;border-left:0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}.sheet .actions{margin-top:4px}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:11px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font:500 13.5px var(--f-ui);color:var(--muted);cursor:pointer}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.note{background:var(--surface-2);color:var(--fg);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5}
.note.warn{background:var(--warn-soft)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:13.5px}
.empty b{display:block;color:var(--fg);font-size:15px;font-weight:600;margin-bottom:4px}
.steps{counter-reset:s;display:grid;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);display:grid;place-items:center;font-weight:500;font-size:12.5px}
.steps li.done::before{content:"\2713";background:var(--pos);border-color:var(--pos);color:#fff}
.steps li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.rows{display:grid;gap:8px}
.rowline{display:grid;grid-template-columns:minmax(0,1fr) 150px 40px;gap:8px;align-items:center}
.rowline.p{grid-template-columns:minmax(0,1fr) 120px 40px}
.rowline.c{grid-template-columns:minmax(0,1fr) 150px 72px 72px 40px}
.rowline.cc{grid-template-columns:minmax(0,1fr) 40px}
.rowline.rhead{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
@media (max-width:600px){.rowline.c{grid-template-columns:1fr 1fr 40px}.rowline.c>input[data-k="nome"]{grid-column:1 / 3}.rowline.c>button{grid-row:1;grid-column:3}.rowline.rhead{display:none}}
.savebar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;justify-content:flex-start;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}

/* configurações em duas colunas */
.set{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:26px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:4px}
.set>div:first-child h3{font-size:15px}
.set>div:first-child p{margin:6px 0 0;color:var(--muted);font-size:13px}
@media (max-width:860px){.set{grid-template-columns:1fr;gap:12px}}

/* ---------- bancos e cartões ---------- */
.acc{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .ic{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:13px}
.acc .ic.alt{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.acc b{display:block;font-weight:500}.acc span{font-size:12.5px;color:var(--muted)}

<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(Number(v)||0);
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>isoOf(new Date());
const ymOf=iso=>String(iso||"").slice(0,7);
const ymKey=(y,m)=>y+"-"+pad(m);
const dim=(y,m)=>new Date(y,m,0).getDate();
const dateFor=(y,m,day)=>ymKey(y,m)+"-"+pad(Math.min(Math.max(1,day),dim(y,m)));
const addYM=(y,m,k)=>{const t=y*12+(m-1)+k;return [Math.floor(t/12),t%12+1];};
const br=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseMoney=s=>{s=String(s??"").trim().replace(/[R$\s]/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s);};
const fmtInput=v=>(v===undefined||v===null||v==="")?"":String(Number(v).toFixed(2)).replace(".",",");
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const r2=v=>Math.round(v*100)/100;

const DEFAULT_CFG={
  contas:[],
  planos:[
    ["Consultoria (Projetos)","Entrada"],["Treinamentos e Workshops","Entrada"],["Mentoria e Acompanhamento","Entrada"],["Diagnósticos","Entrada"],["Parcerias e Comissões","Entrada"],["Rendimentos Financeiros","Entrada"],["Outras Receitas","Entrada"],
    ["Pró-labore","Saída"],["Salários e Encargos","Saída"],["Prestadores de Serviço (PJ)","Saída"],["Impostos (DAS / ISS)","Saída"],["Contabilidade","Saída"],["Aluguel e Condomínio","Saída"],["Energia Elétrica (Luz)","Saída"],["Água","Saída"],["Internet e Telefonia","Saída"],["Softwares e Assinaturas","Saída"],["Material de Escritório","Saída"],["Marketing e Publicidade","Saída"],["Deslocamento e Viagens","Saída"],["Alimentação","Saída"],["Capacitação da Equipe","Saída"],["Tarifas Bancárias","Saída"],["Distribuição de Lucros","Saída"],["Transferência entre Contas (saída)","Saída"],["Transferência entre Contas (entrada)","Entrada"],["Outras Despesas","Saída"]
  ].map(([nome,tipo])=>({nome,tipo})),
  cartoes:[],
  centros:["Administrativo","Comercial e Marketing","Projetos de Clientes","Pessoas"],
  formas:["Pix","Boleto","Transferência (TED)","Cartão de Crédito","Cartão de Débito","Débito Automático","Dinheiro"],
  alerta:7
};

/* ---------- estado ---------- */
const S={cfg:null,cfgLoaded:false,L:new Map(),F:new Map(),lReady:false,fReady:false,
  tab:"inicio",imp:{step:"start",dest:"",items:[]},mov:{per:"mes",base:"prev",by:"plano",show:"tudo",open:null,evo:"desp"},y:new Date().getFullYear(),m:new Date().getMonth()+1,filter:"todas",q:"",
  db:null,canWrite:true,offline:false};
const cfg=()=>S.cfg||DEFAULT_CFG;
const tipoDe=plano=>(cfg().planos.find(p=>p.nome===plano)||{}).tipo||"Saída";
const isIn=l=>l.tipo==="Entrada";
const live=()=>[...S.L.entries()].filter(([,l])=>!l.excluido).map(([id,l])=>({id,...l}));
function status(l){
  const t=today();
  if(l.pago) return {k:"paga",txt:isIn(l)?"Recebida":"Paga"};
  if(l.venc<t) return {k:"atrasada",txt:"Atrasada"};
  if(l.venc===t) return {k:"hoje",txt:"Vence hoje"};
  const lim=new Date();lim.setDate(lim.getDate()+(Number(cfg().alerta)||7));
  if(l.venc<=isoOf(lim)) return {k:"breve",txt:"Vence em breve"};
  return {k:"aberto",txt:"Em aberto"};
}
function origemTag(l){
  if(l.origem&&l.origem.t==="fixa") return '<span class="tag fixa">Fixa</span>';
  if(l.origem&&l.origem.t==="importado")return '<span class="tag">Extrato</span>';
  if(l.origem&&l.origem.t==="parcela") return '<span class="tag">Parcela '+l.origem.n+'/'+l.origem.de+'</span>';
  return "";
}

/* ---------- interface básica ---------- */
const $=s=>document.querySelector(s);
const view=$("#view");
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function setMonthLabel(){$("#mLabel").textContent=MESES[S.m-1]+" "+S.y;}

/* ---------- cálculos ---------- */
function monthData(y,m){
  const k=ymKey(y,m), all=live();
  const venc=all.filter(l=>ymOf(l.venc)===k), pagos=all.filter(l=>l.pago&&ymOf(l.pago)===k);
  const sum=(a,f)=>a.filter(f).reduce((s,l)=>s+(Number(l.valor)||0),0);
  return {venc,
    prevIn:sum(venc,isIn), prevOut:sum(venc,l=>!isIn(l)),
    recIn:sum(pagos,isIn), pagOut:sum(pagos,l=>!isIn(l)),
    abertoIn:sum(venc,l=>isIn(l)&&!l.pago), abertoOut:sum(venc,l=>!isIn(l)&&!l.pago)};
}
function saldos(){
  const res=cfg().contas.map(c=>({nome:c.nome,v:Number(c.saldo)||0}));
  const idx=Object.fromEntries(res.map((r,i)=>[r.nome,i]));
  let sem=0;
  live().filter(l=>l.pago).forEach(l=>{const v=(Number(l.valor)||0)*(isIn(l)?1:-1);
    if(l.banco in idx) res[idx[l.banco]].v+=v; else sem+=v;});
  return {res,sem,total:res.reduce((s,r)=>s+r.v,0)+sem};
}

function render(force){
  if(!force&&S.tab==="importar"&&S.imp.step==="review"&&view.querySelector(".imrow"))return;
  $("#fabNew").hidden=!S.canWrite||!S.lReady||S.tab==="importar";
  if(!S.lReady||!S.fReady){ if(S.offline) return renderOffline(); return; }
  const v={inicio:vInicio,contas:vContas,mov:vMov,fixas:vFixas,bancos:vBancos,importar:vImportar,ajustes:vAjustes}[S.tab];
  killCharts();
  $("#pgTitle").textContent=TABS[S.tab];
  const now=new Date();
  $("#pgSub").textContent={inicio:DIAS[now.getDay()]+", "+now.getDate()+" de "+MESES[now.getMonth()],contas:"Contas a pagar e a receber de "+MESES[S.m-1],mov:"Receitas e despesas por categoria, centro de custo, banco ou cartão",fixas:"O que se repete todo mês entra sozinho",bancos:"Saldos das contas e faturas dos cartões",importar:"Traga o extrato do banco e evite digitar",ajustes:"Categorias, centros de custo e cópia de segurança"}[S.tab]||"";

  view.innerHTML=(S.canWrite?"":'<div class="banner">Você pode ver tudo, mas não pode alterar. Peça ao dono da empresa permissão para editar.</div>')+v();
  if(S.tab==="mov")drawMovCharts();
  if(S.tab==="inicio")ligarSaldo();
}

const CHECK='<svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function amt(v,sign){const n=Math.abs(Number(v)||0),p=BRL.format(n).replace(/^R\$\s?/,""),i=p.lastIndexOf(",");
  return `<span class="amt">${sign||""}<span class="cur">R$</span>${p.slice(0,i)}<span class="cts">${p.slice(i)}</span></span>`;}
const iniciais=t=>String(t||"?").replace(/[^A-Za-zÀ-ÿ0-9 ]/g," ").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
function itemHTML(l,showAct=true,showDate=false){
  const s=status(l),inn=isIn(l);
  const act=!showAct||!S.canWrite?"":(l.pago?"":`<button class="btn pay small" data-act="pay" data-id="${l.id}">${CHECK}${inn?"Recebi":"Paguei"}</button>`);
  const meta=[esc(l.plano)];
  if(l.origem&&l.origem.t==="fixa")meta.push("Recorrente");

  if(l.centro)meta.push(esc(l.centro));

function serieSaldo(){
  const sd=saldos(),hoje=today(),all=live(),pts=[];
  const ini=new Date();ini.setDate(ini.getDate()-60);const fim=new Date();fim.setDate(fim.getDate()+60);
  const base=cfg().contas.reduce((s,c)=>s+(Number(c.saldo)||0),0);
  const pagos=all.filter(l=>l.pago).map(l=>[l.pago,(Number(l.valor)||0)*(isIn(l)?1:-1)]).sort((a,b)=>a[0].localeCompare(b[0]));
  const abertos=all.filter(l=>!l.pago).map(l=>[l.venc<hoje?hoje:l.venc,(Number(l.valor)||0)*(isIn(l)?1:-1)]);
  for(const d=new Date(ini);d<=fim;d.setDate(d.getDate()+1)){
    const k=isoOf(d);let v;
    if(k<=hoje)v=base+pagos.filter(x=>x[0]<=k).reduce((s,x)=>s+x[1],0);
    else v=sd.total+abertos.filter(x=>x[0]<=k).reduce((s,x)=>s+x[1],0);
    pts.push({k,v,fut:k>hoje});}
  return pts;
}
function graficoSaldo(pts){
  const W=900,H=150,P=6,vs=pts.map(p=>p.v),mn=Math.min(...vs,0),mx=Math.max(...vs,1),sp=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)/sp*(H-2*P-14);
  const hi=pts.findIndex(p=>p.fut);const cut=hi<0?pts.length-1:hi-1;
  const path=(a,b)=>pts.slice(a,b+1).map((p,j)=>(j?"L":"M")+x(a+j).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=path(0,cut)+` L${x(cut).toFixed(1)} ${H-P} L${x(0)} ${H-P} Z`;
  const z=mn<0?`<line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--late)" stroke-dasharray="3 4" stroke-width="1" opacity=".5"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Saldo em caixa nos últimos 60 dias e previsão para os próximos 60">
    <defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".16"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    ${z}<path d="${area}" fill="url(#gS)"/>
    <path d="${path(0,cut)}" fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="${path(cut,pts.length-1)}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-dasharray="5 5" opacity=".55" vector-effect="non-scaling-stroke"/>
    <line x1="${x(cut)}" x2="${x(cut)}" y1="${P}" y2="${H-P}" stroke="var(--line-2)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <line id="spLine" x1="0" x2="0" y1="${P}" y2="${H-P}" stroke="var(--faint)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>
  </svg>`;
}
function ligarSaldo(){
  const box=view.querySelector(".spark");if(!box)return;const pts=serieSaldo(),tip=box.querySelector(".tip"),ln=box.querySelector("#spLine"),svg=box.querySelector("svg");
  const mv=e=>{const r=svg.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const i=Math.max(0,Math.min(pts.length-1,Math.round(cx/r.width*(pts.length-1))));
    const p=pts[i],px=i/(pts.length-1)*r.width;tip.style.left=px+"px";tip.style.opacity=1;tip.innerHTML=`${p.k.slice(8,10)}/${p.k.slice(5,7)} · <b>${money(p.v)}</b>${p.fut?" previsto":""}`;
    const vx=6+i*(900-12)/(pts.length-1);ln.setAttribute("x1",vx);ln.setAttribute("x2",vx);ln.setAttribute("opacity",1);};
  svg.addEventListener("mousemove",mv);svg.addEventListener("touchmove",mv,{passive:true});
  svg.addEventListener("mouseleave",()=>{tip.style.opacity=0;ln.setAttribute("opacity",0);});
}
function vInicio(){

    <div><div class="k">Resultado previsto</div><div class="v ${d.prevIn-d.prevOut<0?"":"in"}">${amt(d.prevIn-d.prevOut,d.prevIn-d.prevOut<0?"− ":"")}</div><div class="s">Entradas menos saídas do mês</div></div>
  </section>
  <div class="grid two">
    <section class="sec"><div class="sec-h"><h2>A vencer nos próximos 7 dias</h2><button class="link" data-go="contas">Ver todos os lançamentos</button></div>
      ${atras.length?`<div class="alert"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.3"/></svg>${atras.length} conta${atras.length>1?"s":""} em atraso, somando ${money(atras.reduce((s,l)=>s+(Number(l.valor)||0),0))}</div>`:""}
      <div class="panel list">${[...atras,...prox].slice(0,10).map(l=>itemHTML(l,true,true)).join("")||'<div class="empty"><b>Nada para os próximos 7 dias.</b>As contas que vencerem aparecem aqui.</div>'}</div></section>
    <section class="sec"><div class="sec-h"><h2>Maiores despesas de ${MESES[S.m-1]}</h2><button class="link" data-go="mov">Relatórios</button></div>${porPlano(d.venc)}</section>
  </div>`;
  return out;

function porPlano(venc){
  const m=new Map();venc.filter(l=>!isIn(l)).forEach(l=>m.set(l.plano,(m.get(l.plano)||0)+(Number(l.valor)||0)));
  const arr=[...m].sort((a,b)=>b[1]-a[1]);if(!arr.length)return '<div class="panel"><div class="empty"><b>Nenhuma despesa neste mês.</b>Quando houver, as maiores aparecem aqui.</div></div>';
  const mx=arr[0][1],tot=arr.reduce((s,x)=>s+x[1],0);
  return `<div class="panel rank">${arr.slice(0,6).map(([p,v])=>`<div class="r"><span class="t">${esc(p)}</span><span class="num">${money(v)}<span class="pc">${Math.round(v/tot*100)}%</span></span><div class="p"><i style="width:${Math.max(2,v/mx*100)}%"></i></div></div>`).join("")}</div>`;
}

  <div class="panel list">${html||`<div class="empty"><b>Nenhum lançamento ${f==="todas"&&!q?"com vencimento em "+MESES[S.m-1]:"neste filtro"}.</b>${S.canWrite?"Use o botão Lançar para incluir uma conta.":""}</div>`}</div>`;
}
const DIMS={plano:["Plano de contas",l=>l.plano,"(sem plano de contas)"],centro:["Centro de custo",l=>l.centro,"(sem centro de custo)"],banco:["Banco",l=>l.banco,"(sem banco)"],cartao:["Cartão de crédito",l=>l.cartao,"(fora do cartão)"],forma:["Forma de pagamento",l=>l.forma,"(sem forma)"],credor:["Cliente ou fornecedor",l=>l.credor,"(sem nome)"]};
function movGroups(){
  const M=S.mov,k=ymKey(S.y,S.m),inPer=iso=>!!iso&&(M.per==="mes"?ymOf(iso)===k:iso.slice(0,4)===String(S.y));
  let ls=live().filter(l=>M.base==="prev"?inPer(l.venc):(l.pago&&inPer(l.pago)));
  if(M.show==="rec")ls=ls.filter(isIn);if(M.show==="desp")ls=ls.filter(l=>!isIn(l));
  const[,key,none]=DIMS[M.by],g=new Map();
  ls.forEach(l=>{const n=key(l)||none;if(!g.has(n))g.set(n,{n,vazio:!key(l),in:0,out:0,aberto:0,items:[]});const o=g.get(n),v=Number(l.valor)||0;
    if(isIn(l))o.in+=v;else o.out+=v;if(!l.pago&&!isIn(l))o.aberto+=v;o.items.push(l);});
  return [...g.values()].sort((a,b)=>(a.vazio-b.vazio)||(b.in+b.out)-(a.in+a.out));
}

view.addEventListener("click",e=>{

  const fl=e.target.closest("[data-filter]");if(fl){S.filter=fl.dataset.filter;render();return;}

  const id=a.dataset.id, act=a.dataset.act;

  else if(act==="imp-reset"){S.imp={step:"start",dest:S.imp.dest,items:[]};render(true);}

function modal(html,onMount){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=root.firstChild;
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-close]"))close();});
  const esch=e=>{if(e.key==="Escape")close();};document.addEventListener("keydown",esch);
  function close(){root.innerHTML="";document.removeEventListener("keydown",esch);}
  onMount&&onMount(ov.querySelector(".sheet"),close);

function parcPlan(sh){
  const g=id=>{const x=sh.querySelector("#"+id);return x?x.value.trim():"";};
  const tot=parseMoney(g("n_val")),np=parseInt(g("n_np"),10),venc=g("n_venc"),vp=parseMoney(g("n_vp"));
  const ini=Math.max(1,parseInt(g("n_ini"),10)||1);
  if(!(np>=1&&np<=60)||!venc||ini>np)return null;
  if(!(vp>0)&&!(tot>0))return null;
  const base=vp>0?r2(vp):r2(Math.floor(tot/np*100)/100);
  const y=+venc.slice(0,4),mm=+venc.slice(5,7),day=+venc.slice(8,10);
  const items=[];
  for(let n=ini;n<=np;n++){const[yy,m2]=addYM(y,mm,n-ini);
    const valor=vp>0?base:(n===np?r2(tot-base*(np-1)):base);
    items.push({n,venc:dateFor(yy,m2,day),valor});}
  return {np,items};
}
function writeErr(x){const c=x&&x.code;

  if(c==="quota_exceeded")return "O espaço de dados encheu. Avise o dono da empresa.";
  return "Não foi possível salvar agora. Confira a internet e tente de novo.";}

/* ---------- importar extrato (OFX e CSV) ---------- */
const h32=str=>{let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return (h>>>0).toString(36);};
const days=(a,b)=>(Date.parse(a)-Date.parse(b))/864e5;
const normDesc=d=>String(d||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]+/g," ").replace(/\b(pix|ted|doc|transf|transferencia|enviada|recebida|enviado|recebido|pagamento|pag|compra|cartao|debito|credito|boleto|de|da|do|para|em|no|na|parcela)\b/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
const titulo=d=>String(d||"").replace(/^\s*(pix\s+(recebido|enviado|recebida|enviada)|pag(amento)?\s+(de\s+)?boleto|ted\s+(recebida|enviada)?|doc\s+|compra\s+(no\s+)?(cart[aã]o\s+)?(d[eé]bito\s+)?|d[eé]bito\s+autom[aá]tico|transf(er[eê]ncia)?\s+(recebida|enviada)?)\s*[-:]?\s*/i,"").replace(/\s+/g," ").trim().slice(0,48).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
function decodeBuf(buf){let t=new TextDecoder("utf-8").decode(buf);if(t.includes("\uFFFD"))t=new TextDecoder("windows-1252").decode(buf);return t.replace(/^\uFEFF/,"");}
function parseSigned(v){let s=String(v??"").trim();if(!s)return NaN;
  let neg=/^\(.*\)$/.test(s)||/-/.test(s)||/\sD$/i.test(s);
  s=s.replace(/[^0-9.,]/g,"");if(!s)return NaN;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");}
  else if(lc>-1){s=s.replace(/,/g,(m,o)=>o===lc?".":"");}
  else if((s.match(/\./g)||[]).length>1){s=s.replace(/\.(?=.*\.)/g,"");}
  const n=Number(s);return isNaN(n)?NaN:(neg?-n:n);}
function parseDateBR(v){const s=String(v||"").trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${pad(mo)}-${pad(d)}`;}
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})/))return `${m[1]}-${m[2]}-${m[3]}`;
  return null;}
function parseOFX(t){const out=[];
  t.split(/<STMTTRN>/i).slice(1).forEach(b0=>{const b=b0.split(/<\/STMTTRN>/i)[0];
    const f=k=>{const m=b.match(new RegExp("<"+k+">([^<\\r\\n]*)","i"));return m?m[1].trim():"";};
    const data=parseDateBR(f("DTPOSTED")),valor=parseSigned(f("TRNAMT"));
    if(!data||isNaN(valor))return;
    const memo=f("MEMO"),name=f("NAME");
    out.push({data,valor,desc:(memo&&name&&!memo.includes(name)?name+" "+memo:memo||name||f("TRNTYPE")).replace(/\s+/g," ").trim(),fitid:f("FITID")});});
  return out;}
function parseCSV(t){
  const lines=t.split(/\r?\n/).filter(l=>l.trim());const sample=lines.slice(0,10).join("\n");
  const cnt=c=>(sample.match(new RegExp(c==="\t"?"\t":"\\"+c,"g"))||[]).length;
  const delim=[";",",","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===delim){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);if(row.some(c=>c.trim()))rows.push(row.map(c=>c.trim()));row=[];cur="";}
    else cur+=ch;}
  row.push(cur);if(row.some(c=>c.trim()))rows.push(row.map(c=>c.trim()));
  let hi=rows.findIndex(r=>r.some(c=>/^(data|date|dt)\b/i.test(c)));
  const width=Math.max(...rows.map(r=>r.length));
  let header,body;
  if(hi>=0){header=rows[hi];body=rows.slice(hi+1);}else{header=[...Array(width)].map((_,i)=>"Coluna "+(i+1));body=rows;}
  body=body.filter(r=>r.length>=2);
  const find=re=>header.findIndex(h=>re.test(h));
  const score=(i,fn)=>body.slice(0,20).filter(r=>fn(r[i])).length;
  let d=find(/^(data|date|dt)/i);if(d<0)d=[...header.keys()].sort((a,b)=>score(b,parseDateBR)-score(a,parseDateBR))[0];
  let v=find(/valor|amount|quantia|montante|value/i);
  let cr=find(/cr[eé]dito|entrada/i),db=find(/d[eé]bito|sa[ií]da/i);
  if(v<0&&!(cr>=0&&db>=0)){v=[...header.keys()].filter(i=>i!==d).sort((a,b)=>score(b,x=>!isNaN(parseSigned(x))&&/\d[.,]\d{2}\b/.test(x||""))-score(a,x=>!isNaN(parseSigned(x))&&/\d[.,]\d{2}\b/.test(x||"")))[0];}
  let ds=find(/descri|hist[oó]rico|lan[cç]amento|title|estabelecimento|memo|detalhe|t[ií]tulo/i);
  if(ds<0)ds=[...header.keys()].filter(i=>i!==d&&i!==v).sort((a,b)=>body.slice(0,20).reduce((s,r)=>s+String(r[b]||"").length,0)-body.slice(0,20).reduce((s,r)=>s+String(r[a]||"").length,0))[0];
  return {header,body,map:{d,ds,v:v>=0?v:-1,cr:v>=0?-1:cr,db:v>=0?-1:db}};
}
function csvItems(){const I=S.imp,m=I.map;
  return I.body.map(r=>{const data=parseDateBR(r[m.d]);let valor;
    if(m.v>=0)valor=parseSigned(r[m.v]);else{const c=parseSigned(r[m.cr]),dd=parseSigned(r[m.db]);valor=(isNaN(c)?0:Math.abs(c))-(isNaN(dd)?0:Math.abs(dd));if(isNaN(c)&&isNaN(dd))valor=NaN;}
    if(I.sinal==="desp")valor=-valor;
    return {data,valor,desc:String(r[m.ds]||"").trim(),fitid:""};}).filter(x=>x.data&&!isNaN(x.valor)&&x.valor!==0);
}
function destInfo(dest){const[t,...n]=String(dest).split(":");return {kind:t==="c"?"cartao":"banco",nome:n.join(":")};}
function sugestao(desc,entrada){
  const k=normDesc(desc);
  if(k){const h=live().filter(l=>l.imp&&l.imp.k===k&&isIn(l)===entrada).sort((a,b)=>String(b.criado||"").localeCompare(String(a.criado||"")))[0];if(h)return {k,credor:h.credor,plano:h.plano,centro:h.centro||""};
    const h2=live().find(l=>normDesc(l.credor)===k&&isIn(l)===entrada);if(h2)return {k,credor:h2.credor,plano:h2.plano,centro:h2.centro||""};}
  return {k,credor:titulo(desc),plano:"",centro:""};
}
function buildReview(raw){
  const I=S.imp,{kind,nome}=destInfo(I.dest),used=new Set(),seen={};
  const items=raw.sort((a,b)=>a.data.localeCompare(b.data)).map(x=>{
    const base=I.dest+"|"+x.data+"|"+x.valor.toFixed(2)+"|"+x.desc+"|"+x.fitid;seen[base]=(seen[base]||0)+1;
    const id="im-"+h32(base+"|"+seen[base]),entrada=x.valor>0,abs=r2(Math.abs(x.valor)),sg=sugestao(x.desc,entrada);
    const it={...x,id,abs,entrada,k:sg.k,credor:sg.credor,plano:sg.plano,centro:sg.centro,act:"nova",match:null,nota:""};
    if(S.L.has(id)){it.act="ignorar";it.nota="Já importada antes";return it;}
    const eq=l=>Math.abs((Number(l.valor)||0)-abs)<0.01&&isIn(l)===entrada&&!used.has(l.id);
    if(kind==="banco"){
      const pg=live().filter(l=>eq(l)&&l.pago&&l.banco===nome&&Math.abs(days(l.pago,x.data))<=10).sort((a,b)=>Math.abs(days(a.pago,x.data))-Math.abs(days(b.pago,x.data)))[0];
      if(pg){used.add(pg.id);it.act="ignorar";it.nota="Já registrada como paga: "+pg.credor;return it;}
      const ab=live().filter(l=>eq(l)&&!l.pago&&!l.cartao&&(!l.banco||l.banco===nome)&&Math.abs(days(l.venc,x.data))<=10).sort((a,b)=>Math.abs(days(a.venc,x.data))-Math.abs(days(b.venc,x.data)))[0];
      if(ab){used.add(ab.id);it.act="baixar";it.match=ab.id;it.nota=ab.credor+" · venc. "+br(ab.venc);}
    }else{
      if(entrada){it.act="ignorar";it.nota="Pagamento da fatura ou estorno";return it;}
      const ex=live().filter(l=>eq(l)&&l.cartao===nome&&days(l.venc,x.data)>=-5&&days(l.venc,x.data)<=70).sort((a,b)=>days(a.venc,x.data)-days(b.venc,x.data))[0];
      if(ex){used.add(ex.id);it.act="ignorar";it.nota="Já lançada: "+ex.credor+(ex.origem&&ex.origem.t==="parcela"?" (parcela "+ex.origem.n+"/"+ex.origem.de+")":"");}
    }
    return it;});
  I.items=items;I.step="review";
}

    const h=I.header,sel=(id,val,blank)=>`<select id="${id}">${blank?`<option value="-1">${blank}</option>`:""}${h.map((t,i)=>`<option value="${i}" ${+val===i?"selected":""}>${esc(t||"Coluna "+(i+1))}</option>`).join("")}</select>`;
    const prev=csvItems().slice(0,5);
    return `<div class="card"><h3>Confira as colunas do arquivo</h3><p style="color:var(--muted);font-size:14px;margin:.3em 0 12px">${esc(I.file)}: ${I.body.length} linha(s). O aplicativo tentou adivinhar. Corrija se estiver errado.</p>
      <div class="form">
        <label class="f">Coluna da data${sel("mp_d",I.map.d)}</label>
        <label class="f">Coluna da descrição${sel("mp_ds",I.map.ds)}</label>
        <label class="f">Coluna do valor${sel("mp_v",I.map.v,"Entradas e saídas estão separadas")}</label>
        <label class="f">Valores positivos são<select id="mp_sinal"><option value="rec" ${I.sinal==="rec"?"selected":""}>Dinheiro entrando (extrato de banco)</option><option value="desp" ${I.sinal==="desp"?"selected":""}>Despesas (fatura de cartão)</option></select></label>
        ${I.map.v<0?`<label class="f">Coluna das entradas${sel("mp_cr",I.map.cr,"Nenhuma")}</label><label class="f">Coluna das saídas${sel("mp_db",I.map.db,"Nenhuma")}</label>`:""}
      </div></div>
    <div class="card"><h3 style="margin-bottom:8px">Como as primeiras linhas vão ficar</h3>
      ${prev.length?prev.map(x=>`<div class="hbar" style="grid-template-columns:90px minmax(0,1fr) 130px"><span class="num">${br(x.data)}</span><span class="t">${esc(x.desc)}</span><b class="num ${x.valor>0?"in":"out"}" style="text-align:right">${x.valor>0?"+ ":"- "}${money(Math.abs(x.valor))}</b></div>`).join(""):'<p class="note warn" style="margin:0">Nenhuma linha com data e valor válidos. Confira as colunas acima.</p>'}
      <div class="actions" style="margin-top:14px"><button class="btn" data-act="imp-reset">Voltar</button><button class="btn primary" data-act="imp-map" ${prev.length?"":"disabled"}>Continuar</button></div></div>`;
  }
  if(I.step==="review"){
    const its=I.items,n=a=>its.filter(x=>x.act===a).length;
    const planosDe=e=>c.planos.filter(p=>(p.tipo==="Entrada")===e);
    const rows=its.map((x,i)=>`<div class="imrow act-${x.act}" data-ri="${i}">
      <div class="num d">${br(x.data).slice(0,5)}</div>
      <div class="ds"><b>${esc(x.desc||"(sem descrição)")}</b>${x.nota?`<span>${esc(x.nota)}</span>`:""}</div>
      <div class="num v ${x.entrada?"in":"out"}">${x.entrada?"+ ":"- "}${money(x.abs)}</div>
      <select data-f="act" aria-label="O que fazer">
        <option value="nova" ${x.act==="nova"?"selected":""}>Lançar como nova</option>
        ${x.match?`<option value="baixar" ${x.act==="baixar"?"selected":""}>Dar baixa na conta existente</option>`:""}
        <option value="ignorar" ${x.act==="ignorar"?"selected":""}>Ignorar</option></select>
      <div class="det" ${x.act==="nova"?"":"hidden"}>
        <input data-f="credor" value="${esc(x.credor)}" aria-label="Nome" placeholder="Nome">
        <select data-f="plano" aria-label="Plano de contas"><option value="">Plano de contas...</option>${planosDe(x.entrada).map(p=>`<option ${p.nome===x.plano?"selected":""}>${esc(p.nome)}</option>`).join("")}</select>
        <select data-f="centro" aria-label="Centro de custo">${opts(c.centros||[],x.centro,"Centro de custo")}</select>
      </div></div>`).join("");
    const semPlano=its.filter(x=>x.act==="nova"&&!x.plano).length;
    return `<div class="card"><div class="toolbar"><div><h3>Revise antes de importar</h3><p style="color:var(--muted);font-size:14px;margin:.3em 0 0">${esc(I.file)} · ${esc(destInfo(I.dest).kind==="cartao"?"Fatura do cartão ":"Extrato do banco ")}${esc(info.nome)}</p></div>
      <div class="chips"><span class="tag">${n("nova")} novas</span><span class="tag fixa">${n("baixar")} baixas</span><span class="tag">${n("ignorar")} ignoradas</span></div></div>
      <div class="note" style="margin-top:12px">${info.kind==="banco"?"<b>Dar baixa</b> marca como paga uma conta que já estava lançada, com o mesmo valor e data próxima. <b>Lançar como nova</b> cria a conta já paga neste banco.":"As compras novas entram como contas a pagar no vencimento da fatura. Parcelas e compras já lançadas são reconhecidas e ignoradas."} Escolher o plano de contas numa linha preenche as outras parecidas.</div>
      <div id="imrows" style="margin-top:8px">${rows||'<div class="empty"><b>Nenhum movimento no arquivo.</b></div>'}</div>
      ${semPlano?`<p style="font-size:13px;color:var(--warn);margin:10px 0 0" id="semPlano">${semPlano} linha(s) nova(s) sem plano de contas vão entrar como Outras Despesas ou Outras Receitas.</p>`:""}
      <div class="actions" style="margin-top:14px"><button class="btn" data-act="imp-reset">Cancelar</button><button class="btn primary" data-act="imp-go" ${I.busy?"disabled":""}>${I.busy?"Importando "+I.prog+"...":"Importar"}</button></div></div>`;
  }
  if(I.step==="done")return `<div class="card empty"><b>Importação concluída.</b>${I.res}<div class="actions" style="justify-content:center;margin-top:14px"><button class="btn" data-act="imp-reset">Importar outro arquivo</button><button class="btn primary" data-go="contas">Ver contas</button></div></div>`;
  return "";
}
async function lerArquivo(file){
  const I=S.imp;I.file=file.name;
  try{const t=decodeBuf(await file.arrayBuffer());
    if(/\.ofx$/i.test(file.name)||/<OFX>|<STMTTRN>/i.test(t)){const its=parseOFX(t);if(!its.length){toast("Não achei movimentos neste OFX");return;}buildReview(its);}
    else{const r=parseCSV(t);if(!r.body.length){toast("Não achei linhas neste arquivo");return;}Object.assign(I,r,{sinal:destInfo(I.dest).kind==="cartao"?"desp":"rec",step:"map"});}
    render(true);}catch(x){console.warn(x);toast("Não consegui ler este arquivo");}
}
async function importar(){
  const I=S.imp;if(I.busy)return;const{kind,nome}=destInfo(I.dest),cc=(cfg().cartoes||[]).find(x=>x.nome===nome)||{};
  const todo=I.items.filter(x=>x.act!=="ignorar");I.busy=true;let feitos=0,novas=0,baixas=0;
  const outro=e=>{const n=e?"Outras Receitas":"Outras Despesas";const p=cfg().planos;return p.some(x=>x.nome===n)?n:(p.find(x=>(x.tipo==="Entrada")===e)||{}).nome||n;};
  try{for(const x of todo){I.prog=(++feitos)+" de "+todo.length;const b=view.querySelector('[data-act="imp-go"]');if(b)b.textContent="Importando "+I.prog+"...";
      if(x.act==="baixar"&&x.match){await S.db.doc("lancamentos/"+x.match).update({pago:x.data,banco:nome,valor:x.abs});baixas++;}
      else if(x.act==="nova"){const plano=x.plano||outro(x.entrada);
        const docu={credor:(x.credor||titulo(x.desc)).trim(),plano,tipo:tipoDe(plano),valor:x.abs,centro:x.centro||"",obs:x.desc,origem:{t:"importado"},imp:{k:x.k,arq:I.file},criado:new Date().toISOString()};
        if(kind==="banco")Object.assign(docu,{venc:x.data,pago:x.data,banco:nome,cartao:"",forma:""});
        else Object.assign(docu,{venc:I.fat||x.data,pago:null,banco:cc.banco||"",cartao:nome,forma:"Cartão de Crédito",obs:x.desc+" (compra em "+br(x.data)+")"});
        await S.db.doc("lancamentos/"+x.id).set(docu);novas++;}}
    I.res=`${novas} lançamento(s) novo(s) e ${baixas} conta(s) baixada(s).`;I.step="done";}
  catch(x){toast(writeErr(x));}
  I.busy=false;render(true);
}

/* ---------- exportar ---------- */
let downloads=null;
async function exportXlsx(){
  if(!downloads||!window.XLSX){toast("Baixar não está disponível nesta tela");return;}
  const d=s=>s?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null;
  const rows=live().sort((a,b)=>a.venc.localeCompare(b.venc)).map(l=>({"Vencimento":d(l.venc),"Credor / Cliente":l.credor,"Plano de Contas":l.plano,"Tipo":l.tipo,"Valor (R$)":Number(l.valor)||0,"Forma de Pagamento":l.forma||"","Conta / Banco":l.banco||"","Cartão":l.cartao||"","Centro de Custo":l.centro||"","Data do Pagamento / Recebimento":d(l.pago),"Situação":status(l).txt,"Observação":l.obs||"","Origem":l.origem&&l.origem.t==="fixa"?"Conta fixa":l.origem&&l.origem.t==="parcela"?`Parcela ${l.origem.n}/${l.origem.de}`:"Avulsa"}));
  const fx=[...S.F.values()].map(f=>({"Dia":f.dia,"Credor / Cliente":f.credor,"Plano de Contas":f.plano,"Valor (R$)":f.valor,"Forma de Pagamento":f.forma||"","Conta / Banco":f.banco||"","Cartão":f.cartao||"","Centro de Custo":f.centro||"","Ativa":f.ativa===false?"Não":"Sim"}));
  const sd=saldos();const bk=sd.res.map((r,i)=>({"Banco":r.nome,"Saldo inicial (R$)":Number(cfg().contas[i].saldo)||0,"Saldo hoje (R$)":r2(r.v)}));
  const wb=XLSX.utils.book_new();
  const add=(data,name,widths)=>{const ws=XLSX.utils.json_to_sheet(data.length?data:[{}],{cellDates:true,dateNF:"dd/mm/yyyy"});ws["!cols"]=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name);};
  add(rows,"Lançamentos",[12,30,28,9,14,18,20,18,22,16,14,36,14]);add(fx,"Contas Fixas",[6,30,28,14,18,20,18,22,7]);add(bk,"Bancos",[24,18,18]);
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
  try{await downloads.save({filename:"Financeiro_EXPLORE_"+today()+".xlsx",data:buf});}
  catch(x){if(x&&x.code!=="declined")toast("Não foi possível baixar agora");}
}

/* ---------- contas fixas: lançar os meses sozinho ---------- */
let genBusy=false,genAgain=false;
async function ensureFixas(){
  if(!S.canWrite||!S.lDef||!S.fDef||!S.db)return;
  if(genBusy){genAgain=true;return;}genBusy=true;
  try{
    const now=new Date(),[hy,hm]=addYM(now.getFullYear(),now.getMonth()+1,2),hKey=ymKey(hy,hm);
    for(const[fid,f]of S.F){
      if(f.ativa===false||!f.inicio||!(f.dia>=1))continue;
      let[y,m]=f.inicio.split("-").map(Number),guard=0;
      while(ymKey(y,m)<=hKey&&guard++<60){
        const k=ymKey(y,m),id="fx-"+fid+"-"+k;
        if(!S.L.has(id)){
          await S.db.doc("lancamentos/"+id).set({venc:dateFor(y,m,f.dia),credor:f.credor,plano:f.plano,tipo:tipoDe(f.plano),valor:f.valor,forma:f.forma||"",banco:f.banco||"",centro:f.centro||"",cartao:f.cartao||"",obs:f.obs||"",pago:null,origem:{t:"fixa",fixa:fid,mes:k},criado:new Date().toISOString()});
          S.L.set(id,{venc:dateFor(y,m,f.dia),credor:f.credor,plano:f.plano,tipo:tipoDe(f.plano),valor:f.valor,pago:null,origem:{t:"fixa",fixa:fid,mes:k}});
        }
        [y,m]=addYM(y,m,1);
      }
    }
  }catch(x){console.warn("fixas",x);}
  genBusy=false;if(genAgain){genAgain=false;ensureFixas();}
}

/* ---------- conexão com os dados ---------- */
(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){S.offline=true;S.lReady=S.fReady=false;renderOffline();return;}
  S.db=db;
  const user=await window.claude?.use?.("user");
  try{const c=user&&await user.can("data.write");if(c===false)S.canWrite=false;}catch(_){}
  downloads=await window.claude?.use?.("downloads");
  db.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?{...DEFAULT_CFG,...s.data()}:null;S.cfgLoaded=true;if(S.tab!=="ajustes")render();},e=>console.warn(e));
  db.collection("lancamentos").onSnapshot(s=>{
    S.L=new Map(s.docs.map(d=>[d.id,d.data()]));
    S.lReady=true;if(!s.metadata.fromCache)S.lDef=true;
    render();if(!s.metadata.hasPendingWrites)ensureFixas();
  },e=>{console.warn(e);if(!S.lReady){S.offline=true;renderOffline();}});
  db.collection("fixas").onSnapshot(s=>{
    S.F=new Map(s.docs.map(d=>[d.id,d.data()]));
    S.fReady=true;if(!s.metadata.fromCache)S.fDef=true;
    render();ensureFixas();
  },e=>console.warn(e));
})();
})();
</script>
