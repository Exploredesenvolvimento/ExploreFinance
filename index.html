<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Contas a pagar e a receber, cartões, orçamento e extratos, para uso pessoal ou da empresa.">
<meta name="theme-color" content="#001c28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: menu lateral fixo (marca, navegação) + área de trabalho com barra de título; no celular o menu vira barra inferior.
   Visual de banco digital: fundo neutro quente, superfícies brancas só onde há lista, bordô reservado para ação e item ativo. */
:root{
  --bg:#f4f6f1; --side:#f9faf6; --surface:#ffffff; --surface-2:#eef1ea; --hover:#f2f5ee;
  --line:#e0e5dc; --line-2:#cdd5c9; --fg:#0b1f27; --muted:#5a6a66; --faint:#8b9894;
  --brand:#001c28; --brand-ink:#ffffff; --brand-soft:#eef8d0; --brand-line:#d3e6a0;
  --pos:#386b1e; --pos-soft:#e9f3df; --late:#c0352b; --late-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#faf0d9;
  --in:var(--pos); --out:var(--fg); --gold:#b58a4c;
  --bar-in:#4c8b30; --bar-out:#001c28;
  --c1:#0c3341; --c2:#386b1e; --c3:#b08a2e; --c4:#2b7a6f; --c5:#b5573b; --c6:#5a5f9e; --c7:#c0839a; --c8:#7d8a87; --cx:#c9d0c6;
  --f-ui:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --side-w:240px; --shadow:0 1px 2px rgba(11,31,39,.04), 0 8px 24px rgba(11,31,39,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071319; --side:#0a171d; --surface:#0f1e25; --surface-2:#16272f; --hover:#13232a;
  --line:#20343d; --line-2:#2e454f; --fg:#eef4e8; --muted:#9db0ab; --faint:#6d807c;
  --brand:#e5fb99; --brand-ink:#001c28; --brand-soft:#1d2b16; --brand-line:#3c5226;
  --pos:#8fd16a; --pos-soft:#15261a; --late:#ff7b6f; --late-soft:#2e1614; --warn:#f0b450; --warn-soft:#2b2010;
  --gold:#d6b07a; --bar-in:#8fd16a; --bar-out:#e5fb99;
  --c1:#e5fb99; --c2:#8fd16a; --c3:#d9c46a; --c4:#6cc2b4; --c5:#e8957c; --c6:#a3a8e6; --c7:#e3b3c4; --c8:#a8b6b3; --cx:#34474f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071319; --side:#0a171d; --surface:#0f1e25; --surface-2:#16272f; --hover:#13232a;
  --line:#20343d; --line-2:#2e454f; --fg:#eef4e8; --muted:#9db0ab; --faint:#6d807c;
  --brand:#e5fb99; --brand-ink:#001c28; --brand-soft:#1d2b16; --brand-line:#3c5226;
  --pos:#8fd16a; --pos-soft:#15261a; --late:#ff7b6f; --late-soft:#2e1614; --warn:#f0b450; --warn-soft:#2b2010;
  --gold:#d6b07a; --bar-in:#8fd16a; --bar-out:#e5fb99;
  --c1:#e5fb99; --c2:#8fd16a; --c3:#d9c46a; --c4:#6cc2b4; --c5:#e8957c; --c6:#a3a8e6; --c7:#e3b3c4; --c8:#a8b6b3; --cx:#34474f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
:root[data-tema="vinho"]{--brand:#612b4a;--brand-ink:#ffffff;--brand-soft:#f3ebef;--brand-line:#e3cfd9;--bar-out:#612b4a;--c1:#612b4a}
@media (prefers-color-scheme: dark){:root[data-tema="vinho"]:not([data-theme="light"]){--brand:#d08cb0;--brand-ink:#14100f;--brand-soft:#2a1b24;--brand-line:#4a2d3d;--bar-out:#d08cb0;--c1:#d08cb0}}
:root[data-theme="dark"][data-tema="vinho"]{--brand:#d08cb0;--brand-ink:#14100f;--brand-soft:#2a1b24;--brand-line:#4a2d3d;--bar-out:#d08cb0;--c1:#d08cb0}
:root[data-tema="azul"]{--brand:#24527d;--brand-ink:#ffffff;--brand-soft:#e9f0f7;--brand-line:#c9daea;--bar-out:#24527d;--c1:#24527d}
@media (prefers-color-scheme: dark){:root[data-tema="azul"]:not([data-theme="light"]){--brand:#86b4e0;--brand-ink:#14100f;--brand-soft:#16202b;--brand-line:#2a4058;--bar-out:#86b4e0;--c1:#86b4e0}}
:root[data-theme="dark"][data-tema="azul"]{--brand:#86b4e0;--brand-ink:#14100f;--brand-soft:#16202b;--brand-line:#2a4058;--bar-out:#86b4e0;--c1:#86b4e0}
:root[data-tema="verde"]{--brand:#1f6b4a;--brand-ink:#ffffff;--brand-soft:#e7f2ec;--brand-line:#c3dfcf;--bar-out:#1f6b4a;--c1:#1f6b4a}
@media (prefers-color-scheme: dark){:root[data-tema="verde"]:not([data-theme="light"]){--brand:#7cc9a3;--brand-ink:#14100f;--brand-soft:#14241c;--brand-line:#25443a;--bar-out:#7cc9a3;--c1:#7cc9a3}}
:root[data-theme="dark"][data-tema="verde"]{--brand:#7cc9a3;--brand-ink:#14100f;--brand-soft:#14241c;--brand-line:#25443a;--bar-out:#7cc9a3;--c1:#7cc9a3}
:root[data-tema="grafite"]{--brand:#33383f;--brand-ink:#ffffff;--brand-soft:#eef0f2;--brand-line:#d5d9de;--bar-out:#33383f;--c1:#33383f}
@media (prefers-color-scheme: dark){:root[data-tema="grafite"]:not([data-theme="light"]){--brand:#c3c9d1;--brand-ink:#14100f;--brand-soft:#1d2024;--brand-line:#3a3f46;--bar-out:#c3c9d1;--c1:#c3c9d1}}
:root[data-theme="dark"][data-tema="grafite"]{--brand:#c3c9d1;--brand-ink:#14100f;--brand-soft:#1d2024;--brand-line:#3a3f46;--bar-out:#c3c9d1;--c1:#c3c9d1}
:root[data-tema="terracota"]{--brand:#a3482c;--brand-ink:#ffffff;--brand-soft:#f8ece6;--brand-line:#ecd0c3;--bar-out:#a3482c;--c1:#a3482c}
@media (prefers-color-scheme: dark){:root[data-tema="terracota"]:not([data-theme="light"]){--brand:#eba287;--brand-ink:#14100f;--brand-soft:#2b1b16;--brand-line:#4d3127;--bar-out:#eba287;--c1:#eba287}}
:root[data-theme="dark"][data-tema="terracota"]{--brand:#eba287;--brand-ink:#14100f;--brand-soft:#2b1b16;--brand-line:#4d3127;--bar-out:#eba287;--c1:#eba287}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
.num,.amt{font-variant-numeric:tabular-nums}
button{font-family:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:18px;overflow:auto}
.org{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--fg);cursor:default}
.org-ic{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.02em;flex:none}
.org-tx{min-width:0;display:grid}
.org-tx b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-tx small{color:var(--muted);font-size:12px}
.side-nav{display:grid;gap:2px}
.side-nav .grp{font-size:11.5px;color:var(--faint);padding:14px 10px 6px;letter-spacing:.02em}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nv:hover{background:var(--hover);color:var(--fg)}
.nv[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
.nv[aria-selected="true"] svg.i{stroke:var(--brand)}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 10px}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.tb-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:18px 14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.tb-title{min-width:0;flex:1}
.tb-title h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.tb-title p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.month{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px}
.month button{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.month button:hover{background:var(--hover);color:var(--fg)}
.month span{min-width:118px;text-align:center;font-weight:500;font-size:13.5px;text-transform:capitalize}
main#view{max-width:1120px;width:100%;margin:0 auto;padding-block:6px 96px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:28px;align-content:start}
main#view>*{min-width:0}
.bottom{display:none}

/* ---------- tipografia e blocos ---------- */
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font-weight:500;font-size:13.5px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}

/* valores em reais */
.amt .cur{font-size:.55em;font-weight:500;color:var(--muted);margin-right:.3em;vertical-align:.45em;letter-spacing:0}
.amt .cts{font-size:.6em;color:var(--muted);font-weight:500}
.in{color:var(--pos)} .out{color:var(--fg)}

/* ---------- visão geral ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end}
.hero .k{font-size:13px;color:var(--muted)}
.hero .big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero .side-k{text-align:right}
.hero .side-k b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.hero .side-k small{color:var(--muted);font-size:12.5px}
.spark{position:relative;margin-top:14px}
.spark svg{display:block;width:100%;height:150px;overflow:visible}
.spark .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s}
.spark .tip b{font-weight:600}
.spark .lg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.spark .lg i{display:inline-block;width:14px;height:0;border-top:2px solid var(--brand);vertical-align:middle;margin-right:6px}
.spark .lg i.dash{border-top-style:dashed;opacity:.7}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{padding:16px 18px 16px 0;min-width:0}
.strip>div+div{padding-left:18px;border-left:1px solid var(--line)}
.strip .k{font-size:12.5px;color:var(--muted)}
.strip .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.strip .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.meter{height:4px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.alert{display:flex;gap:10px;align-items:center;background:var(--late-soft);color:var(--late);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:500}
.rank{display:grid}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
.rank .r:last-child{border-bottom:0}
.rank .r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rank .r .p{grid-column:1 / -1;height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rank .r .p i{display:block;height:100%;background:var(--brand);opacity:.85}
.rank .r .pc{font-size:12px;color:var(--muted);margin-left:8px}

/* ---------- listas de contas ---------- */
.list{display:grid}
.item{display:grid;grid-template-columns:36px minmax(0,1fr) 128px 132px 92px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.list>.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.item:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.item .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.02em}
.item.is-in .ic{background:var(--pos-soft);color:var(--pos)}
.item .ic.dt{display:grid;place-items:center;line-height:1.05;background:transparent;border:1px solid var(--line)}
.item .ic.dt b{font-size:14px;font-weight:600;color:var(--fg)}
.item .ic.dt small{font-size:10px;color:var(--muted);text-transform:uppercase}
.item .who{min-width:0}
.item .who b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .who span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.st-paga .dot{background:var(--pos)}
.st-atrasada .dot{background:var(--late)} .st-atrasada .st{color:var(--late);font-weight:500}
.st-hoje .dot,.st-breve .dot{background:var(--gold)} .st-hoje .st{color:var(--warn);font-weight:500}
.item .v{text-align:right;font-weight:500;font-size:14.5px;white-space:nowrap}
.item .act{display:flex;justify-content:flex-end}
.item.st-paga .v{color:var(--muted)}
.item.is-in.st-paga .v{color:var(--pos)}
.tag{font-size:12px;color:var(--muted)}
.dayh{display:flex;justify-content:space-between;gap:12px;padding:10px 16px 8px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:500}
.dayh:first-child{border-top:0}
.dayh span:first-child{color:var(--fg)}
.panel .empty{padding:44px 20px}

/* ---------- botões e campos ---------- */
.btn{font:500 13.5px var(--f-ui);border-radius:9px;padding:8px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--brand)}
.btn.pay{background:transparent;border-color:var(--line-2);color:var(--fg);padding:5px 10px}
.btn.pay:hover{border-color:var(--pos);color:var(--pos);background:var(--pos-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--late);border-color:var(--late-soft);background:transparent}
.btn.danger:hover{background:var(--late-soft);border-color:var(--late)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:10px;padding:3px}
.chip{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 11px;font:500 13px var(--f-ui);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{position:relative;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:34px;width:230px}
input,select,textarea{font:400 14.5px var(--f-ui);color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
input::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--fg)}
label.f .help{font-weight:400;font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:14px 12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1 / -1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.sum{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum b{color:var(--fg);font-weight:600;font-size:14px;margin-left:4px}

/* ---------- gaveta (janelas) ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,10,14,.36);display:flex;justify-content:flex-end;align-items:stretch}
.sheet{background:var(--surface);color:var(--fg);width:min(500px,100%);height:100%;overflow:auto;padding:22px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.sheet .hd{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.sheet .hd h3{flex:1;font-size:17px}
.sheet .actions{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:760px){.overlay{align-items:flex-end;justify-content:center}.sheet{height:auto;max-height:92%;width:100%;border-radius:18px 18px 0 0;border-left:0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}.sheet .actions{margin-top:4px}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:11px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font:500 13.5px var(--f-ui);color:var(--muted);cursor:pointer}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.note{background:var(--surface-2);color:var(--fg);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5}
.note.warn{background:var(--warn-soft)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:13.5px}
.empty b{display:block;color:var(--fg);font-size:15px;font-weight:600;margin-bottom:4px}
.steps{counter-reset:s;display:grid;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);display:grid;place-items:center;font-weight:500;font-size:12.5px}
.steps li.done::before{content:"\2713";background:var(--pos);border-color:var(--pos);color:#fff}
.steps li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.rows{display:grid;gap:8px}
.rowline{display:grid;grid-template-columns:minmax(0,1fr) 150px 40px;gap:8px;align-items:center}
.rowline.p{grid-template-columns:minmax(0,1fr) 120px 40px}
.rowline.c{grid-template-columns:minmax(0,1fr) 150px 72px 72px 40px}
.rowline.cc{grid-template-columns:minmax(0,1fr) 40px}
.rowline.rhead{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
@media (max-width:600px){.rowline.c{grid-template-columns:1fr 1fr 40px}.rowline.c>input[data-k="nome"]{grid-column:1 / 3}.rowline.c>button{grid-row:1;grid-column:3}.rowline.rhead{display:none}}
.savebar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;justify-content:flex-start;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}

/* configurações em duas colunas */
.set{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:26px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:4px}
.set>div:first-child h3{font-size:15px}
.set>div:first-child p{margin:6px 0 0;color:var(--muted);font-size:13px}
@media (max-width:860px){.set{grid-template-columns:1fr;gap:12px}}

/* ---------- bancos e cartões ---------- */
.acc{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .ic{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:13px}
.acc .ic.alt{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.acc b{display:block;font-weight:500}.acc span{font-size:12.5px;color:var(--muted)}
.acc .big{font-size:17px;font-weight:600;text-align:right;letter-spacing:-.01em}.acc .big small{display:block;font:400 12px var(--f-ui);color:var(--muted);letter-spacing:0}
.acc .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acc.tot{background:var(--surface-2)}
@media (max-width:640px){.acc{grid-template-columns:40px minmax(0,1fr) auto}.acc .act{grid-column:2 / -1;justify-content:flex-start}.acc.tot{grid-template-columns:40px 1fr auto}}

/* ---------- importação ---------- */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:36px 16px;text-align:center;cursor:pointer;color:var(--muted);background:var(--surface);display:grid;justify-items:center;gap:6px}
.drop svg.i{width:26px;height:26px;color:var(--brand)}
.drop b{display:block;color:var(--fg);font-size:15px;font-weight:600}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.imrow{display:grid;grid-template-columns:52px minmax(0,1fr) 120px 220px;gap:6px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.imrow .d{font-weight:500;font-size:13.5px;color:var(--muted)}.imrow .v{text-align:right;font-weight:500}
.imrow .ds{min-width:0}.imrow .ds b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.imrow .ds span{font-size:12px;color:var(--muted)}
.imrow .det{grid-column:2 / -1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.imrow.act-ignorar>.ds,.imrow.act-ignorar>.v,.imrow.act-ignorar>.d{opacity:.45}
.imrow.act-baixar>.ds span{color:var(--pos);font-weight:500}
.imrow select,.imrow input{padding:7px 9px;font-size:13.5px}
@media (max-width:640px){.imrow{grid-template-columns:44px minmax(0,1fr) auto}.imrow>select{grid-column:2 / -1}.imrow .det{grid-template-columns:1fr}}
.stepper{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stepper b{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-2);font-weight:500;font-size:12px;margin-right:6px}
.stepper .on{color:var(--fg)} .stepper .on b{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stepper .sep{width:24px;height:1px;background:var(--line-2)}

/* ---------- relatórios ---------- */
.tablewrap{overflow-x:auto}
.cbox{position:relative;width:100%}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
table.mt{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.mt th{text-align:left;font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500;background:var(--surface-2)}
table.mt th.n,table.mt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.mt td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.mt tr.g{cursor:pointer}
table.mt tr.g:hover td{background:var(--hover)}
table.mt tr.g td:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);margin:0 10px 2px 0;transition:transform .15s}
table.mt tr.g.open td:first-child::before{transform:rotate(45deg)}
table.mt tr.tot td{font-weight:600;border-bottom:0;background:var(--surface-2)}
table.mt tr.det>td{background:var(--bg);padding:0}
table.mt tr.det .item{background:transparent}
.gbar{height:3px;border-radius:99px;background:var(--surface-2);margin-top:7px;overflow:hidden;max-width:200px}
.gbar i{display:block;height:100%;background:var(--brand)}
.ctrl{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.ctrl .lbl{font-size:12.5px;color:var(--muted);margin-right:8px}
.ctrl>div{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.ctrl select{width:auto;padding:7px 30px 7px 10px;font-size:13.5px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 10px;align-items:center;font-size:14px}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;font-size:13.5px;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:13.5px}
.fixa{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.fixa:last-child{border-bottom:0}
.fixa .dia{border:1px solid var(--line);border-radius:10px;text-align:center;padding:5px 0;font-weight:600;line-height:1.05;font-size:15px}
.fixa .dia small{display:block;font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.fixa b{font-weight:500}
.fixa.off{opacity:.5}
@media (max-width:560px){.fixa{grid-template-columns:44px minmax(0,1fr) auto}.fixa .act{grid-column:2 / -1}}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg);cursor:pointer}
.switch input{width:auto;accent-color:var(--brand)}
details summary{cursor:pointer}

/* ---------- escolha do tipo de lançamento ---------- */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{display:grid;gap:8px;justify-items:start;text-align:left;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;color:var(--fg);font:inherit;transition:border-color .12s,background .12s}
.pick button:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.pick b{font-weight:600;font-size:15px}
.pick small{color:var(--muted);font-size:12.5px;line-height:1.35}
.pick .pi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.pick .pi.rec{background:var(--pos-soft);color:var(--pos)}
.pick .pi.desp{background:var(--late-soft);color:var(--late)}
.pick .pi.car{background:var(--brand-soft);color:var(--brand)}
.seg3{grid-template-columns:repeat(3,1fr)}
.calc{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 13px;font-size:13px}
.calc b{font-weight:600}
/* ---------- primeiros passos ---------- */
.onb{display:grid;gap:12px}
.onb-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.onb-h b{font-size:13.5px;color:var(--brand);font-weight:600}
.onb-cards{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.onb-card{scroll-snap-align:start;display:grid;align-content:space-between;gap:14px;min-height:128px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer;color:var(--fg);font:inherit}
.onb-card:hover{border-color:var(--brand-line)}
.onb-card .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--brand-line);display:grid;place-items:center}
.onb-card.done .ck{background:var(--pos);border-color:var(--pos);color:#fff}
.onb-card.done{background:var(--surface-2);cursor:default}
.onb-card.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.onb-card span{font-size:13.5px;line-height:1.35}
/* ---------- tela vazia com prévia ---------- */
.teaser{position:relative;overflow:hidden;min-height:230px}
.teaser .fake{opacity:.22;filter:grayscale(1);pointer-events:none;user-select:none}
.teaser .cta{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:18px;background:color-mix(in srgb,var(--surface) 62%,transparent)}
.teaser .cta b{font-size:15px;font-weight:600}
.teaser .cta p{margin:0;color:var(--muted);font-size:13px;max-width:34ch}
/* ---------- planejamento ---------- */
.plan .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.plan .r:last-child{border-bottom:0}
.plan .r .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .r .q{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.plan .r .q b{color:var(--fg);font-weight:600}
.plan .bar{grid-column:1 / -1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.plan .bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.plan .r.warn .bar i{background:var(--gold)} .plan .r.over .bar i{background:var(--late)}
.plan .r.over .q span{color:var(--late);font-weight:500}
.plan .r input{width:130px;text-align:right}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.big3>div{padding:14px 18px 14px 0}.big3>div+div{padding-left:18px;border-left:1px solid var(--line)}
.big3 .k{font-size:12.5px;color:var(--muted)}.big3 .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
/* ---------- calendário ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .wd{font-size:11.5px;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:88px;padding:8px 10px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:grid;align-content:start;gap:3px}
.cal .dc:hover{background:var(--hover)}
.cal .dc.out{background:var(--bg);cursor:default}
.cal .dc .n{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cal .dc.today .n b{background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:0 6px}
.cal .dc.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.cal .dc .l{font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .dc .l.in{color:var(--pos)}
.cal .dc .late{width:6px;height:6px;border-radius:50%;background:var(--late)}
.cal .dc .dots{display:none}
.cal .dc .dots i{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.cal .dc .dots i.in{background:var(--pos)}
.eye[aria-pressed="true"]{color:var(--brand)}
/* ---------- anexos ---------- */
.anx{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.anx-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.anx-h b{font-weight:600;font-size:14px}.anx-h span{font-size:12.5px;color:var(--muted)}
.anx-l{display:grid;gap:8px}
.anx-i{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.anx-th{width:52px;height:52px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;font-weight:600}
.anx a,.anx a:hover{text-decoration:none}
.anx-th img{width:100%;height:100%;object-fit:cover;display:block}
.anx-i b{display:block;font-size:13.5px;font-weight:600}.anx-i span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anx-add{display:flex;gap:8px;flex-wrap:wrap}
.anx-add label{cursor:pointer}.anx-add label[aria-busy="true"]{opacity:.6;pointer-events:none}
.clip{width:13px;height:13px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rowline.rg{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) 40px}
@media (max-width:600px){.rowline.rg{grid-template-columns:1fr 1fr 40px}.rowline.rg>input{grid-column:1 / 3}.rowline.rg>button{grid-row:1;grid-column:3}}
.regra-tag{font-size:12px;color:var(--brand);font-weight:500}
/* ---------- modo de uso ---------- */
.mp label.f:has(select[id$="_centro"]),.mp label.f:has(#rg_c),.mp .imrow [data-f="centro"],.mp #regras [data-k="centro"],.mp .rowline.rg.rhead span:nth-child(3),.mp #setCentros{display:none}
.mp .rowline.rg{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 40px}
.modo{max-width:760px;margin:24px auto 0;display:grid;gap:18px}
.modo h2{font-size:24px;letter-spacing:-.02em;margin:0}
.modo>p{margin:0;color:var(--muted)}
.modo-op{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modo-op button{display:grid;gap:10px;align-content:start;text-align:left;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;color:var(--fg);font:inherit;transition:border-color .12s,background .12s}
.modo-op button:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.modo-op b{font-size:17px;font-weight:600}
.modo-op small{color:var(--muted);font-size:13.5px;line-height:1.45}
.modo-op ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.6}
@media (max-width:640px){.modo-op{grid-template-columns:1fr}}
/* ---------- selos, bancos e cartões ---------- */
.selo{background:var(--t,#7a2e55)!important;color:#fff!important;border:0!important;font-weight:600;letter-spacing:.02em}
.tons{display:flex;gap:8px;flex-wrap:wrap}
.tons button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--t);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.tons button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.bk-pick{display:grid;gap:10px}
.bk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:232px;overflow:auto;padding:2px}
.bk-list button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 9px;align-items:center;text-align:left;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.bk-list button:hover{border-color:var(--brand-line);background:var(--hover)}
.bk-list button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.bk-list .selo{grid-row:span 2;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px}
.bk-list span{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-list small{font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ccw{display:grid;gap:12px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.ccard{position:relative;aspect-ratio:1.586;border-radius:14px;padding:16px 18px;color:#fff;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.18),transparent 55%),radial-gradient(80% 70% at 0% 100%,rgba(0,0,0,.22),transparent 60%),linear-gradient(140deg,var(--t),color-mix(in srgb,var(--t) 62%,#000));
  box-shadow:0 10px 24px -12px color-mix(in srgb,var(--t) 70%,#000)}
.ccard::after{content:"";position:absolute;right:-30%;bottom:-55%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
.ccard .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .cc-top b{font-weight:600;font-size:15px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .cc-top span{font-size:11.5px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.ccard .cc-chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.22));align-self:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.ccard .cc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ccard .cc-num{font-size:15px;letter-spacing:.16em;font-variant-numeric:tabular-nums;opacity:.92}
.ccard .cc-bot small{display:block;font-size:11px;opacity:.75}
.ccard .cc-bot b{font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ccinfo{display:grid;gap:6px;font-size:13px}
.ccinfo .lim{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.ccinfo .lim b{color:var(--fg);font-weight:600}
.ccinfo .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ccinfo .bar i{display:block;height:100%;border-radius:99px;background:var(--t)}
.ccinfo .bar.warn i{background:var(--gold)}.ccinfo .bar.over i{background:var(--late)}

.dv .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.dv .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.dv .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:6px}.dv .row b{color:var(--fg);font-weight:500}
.tagx{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
/* assinaturas */
.segtabs{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;margin-bottom:16px;max-width:100%}
.segtabs button{border:0;background:transparent;border-radius:7px;padding:7px 14px;font:500 13.5px var(--f-ui);color:var(--muted);cursor:pointer;white-space:nowrap}
.segtabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ass{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.ass:last-child{border-bottom:0}.ass.off{opacity:.55}
.ass .av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:13.5px;color:#fff;border:0;padding:0;overflow:hidden;font-family:inherit;position:relative}
.ass .av[data-assimg]{cursor:pointer}.ass .av img{width:100%;height:100%;object-fit:cover;display:block}
.ass b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ass .sub{display:block;font-size:12.5px;color:var(--muted)}.ass .sub em{color:var(--late);font-style:normal}
.ass .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.ass .val small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ass .act{display:flex;gap:8px}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pos);border-radius:var(--r);padding:14px 16px;font-size:13.5px;line-height:1.5;margin-top:14px}

.q-prev{font-size:13.5px;line-height:1.5;min-height:20px}

.q-card .q-l{display:flex;flex-wrap:wrap;gap:6px}
.q-card .q-l span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
.q-card .q-l span b{font-weight:600}
.q-card .q-l span.falta{border-style:dashed;color:var(--muted)}
.q-card .actions{margin:0}

.colar summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--surface-2);font-weight:600}
.colar[open] summary::before{content:"−"}
.help.warn-t{color:var(--late)}
.codbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.codbox .k{font-size:12.5px;color:var(--muted);grid-column:1}
.codbox code{grid-column:1;font-size:12.5px;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.codbox .btn{grid-column:2;grid-row:1 / span 2}

body.travado{overflow:hidden}
#pinLock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(320px,100%)}
.pl-logo{border-radius:14px}

.pl-msg{margin:0;color:var(--muted);font-size:14px;min-height:2.8em;text-align:center}
.pl-msg.err{color:var(--late)}
.pl-dots{display:flex;gap:16px;margin:4px 0 18px}
.pl-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg);opacity:.5}
.pl-dots i.on{background:var(--fg);opacity:1}
.pl-dots.shake{animation:plshake .35s}
@keyframes plshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.pl-pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:inherit;font-size:24px;font-weight:500;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.pl-pad button:hover{background:var(--hover)}
.pl-pad button:disabled{opacity:.4;cursor:default}
.pl-pad .i{width:24px;height:24px}
.pl-esq{margin-top:16px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}
.pl-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.pdfbtn .i{width:16px;height:16px}

function status(l){
  const t=today();
  if(l.pago) return {k:"paga",txt:isIn(l)?"Recebida":"Paga"};
  const dd=Math.round((Date.parse(l.venc)-Date.parse(t))/864e5);
  if(dd<0) return {k:"atrasada",txt:dd===-1?"Venceu ontem":"Venceu há "+(-dd)+" dias"};
  if(dd===0) return {k:"hoje",txt:"Vence hoje"};
  const k=dd<=(Number(cfg().alerta)||7)?"breve":"aberto";
  if(dd===1) return {k,txt:"Vence amanhã"};
  if(dd<=31) return {k,txt:"Vence em "+dd+" dias"};
  return {k,txt:"Vence "+l.venc.slice(8,10)+"/"+l.venc.slice(5,7)};
}
function origemTag(l){

}

let toastFim=null;
function toast(msg,op){
  if(toastFim){const f=toastFim;toastFim=null;f();}
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast"+(op?" com-acao":"");t.setAttribute("role","status");
  const sp=document.createElement("span");sp.textContent=msg;t.appendChild(sp);
  let tm;
  if(op){const b=document.createElement("button");b.type="button";b.textContent=op.acao||"Desfazer";t.appendChild(b);
    toastFim=()=>{clearTimeout(tm);t.remove();if(op.fim)op.fim();};
    b.onclick=async()=>{toastFim=null;clearTimeout(tm);t.remove();try{await op.fn();toast("Desfeito");}catch(x){toast(writeErr(x));}};}
  document.body.appendChild(t);
  tm=setTimeout(()=>{if(op&&toastFim){const f=toastFim;toastFim=null;f();}else t.remove();},op?6500:2600);
}

function serieSaldo(){
  const sd=saldos(),hoje=today(),all=live(),pts=[];
  const ini=new Date();ini.setDate(ini.getDate()-60);const fim=new Date();fim.setDate(fim.getDate()+60);
  const base=cfg().contas.reduce((s,c)=>s+(Number(c.saldo)||0),0);
  const pagos=all.filter(l=>l.pago).map(l=>[l.pago,(Number(l.valor)||0)*(isIn(l)?1:-1)]).sort((a,b)=>a[0].localeCompare(b[0]));
  const abertos=all.filter(l=>!l.pago).map(l=>[l.venc<hoje?hoje:l.venc,(Number(l.valor)||0)*(isIn(l)?1:-1)]);
  for(const d=new Date(ini);d<=fim;d.setDate(d.getDate()+1)){
    const k=isoOf(d);let v;
    if(k<=hoje)v=base+pagos.filter(x=>x[0]<=k).reduce((s,x)=>s+x[1],0);
    else v=sd.total+abertos.filter(x=>x[0]<=k).reduce((s,x)=>s+x[1],0);

async function prepArquivo(f){
  let type=f.type||(/\.pdf$/i.test(f.name)?"application/pdf":/\.jpe?g$/i.test(f.name)?"image/jpeg":/\.png$/i.test(f.name)?"image/png":"");
  if(/^image\//.test(type)&&type!=="image/gif"){
    try{const bmp=await createImageBitmap(f);const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
      if(sc<1||f.size>900000||!ANX_TIPOS.test(type)){const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
        const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
        if(b)return new File([b],f.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"});}}catch(_){}
  }

}

const semAc=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function buscar(q){
  const t=semAc(q).trim();if(!t)return [];
  const nq=t.replace(/^r\$\s*/,"").replace(/\s/g,"");
  const ehNum=/^\d+(\.\d{3})*(,\d{0,2})?$/.test(nq),nc=nq.replace(/\./g,"");
  if(!ehNum&&t.length<2)return [];
  const termos=t.split(/\s+/);
  return live().filter(l=>{
    if(ehNum){const f=(Number(l.valor)||0).toFixed(2).replace(".",",");if(f===nc||f.startsWith(nc.includes(",")?nc:nc+","))return true;}
    const txt=semAc([l.credor,l.plano,l.obs,l.centro,l.banco,l.cartao,l.forma,l.divisao&&l.divisao.com].filter(Boolean).join(" "));
    return termos.every(x=>txt.includes(x));
  }).sort((a,b)=>b.venc.localeCompare(a.venc));
}

/* ---------- recibo ---------- */
function extenso(v){
  const U=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999=n=>{if(n===100)return "cem";const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r)p.push(r<20?U[r]:D[Math.floor(r/10)]+(r%10?" e "+U[r%10]:""));return p.join(" e ");};
  const inteiro=n=>{if(!n)return "zero";const G=[[1e9,"bilhão","bilhões"],[1e6,"milhão","milhões"],[1e3,"mil","mil"],[1,"",""]],p=[];let r=n;
    for(const[q,s1,s2]of G){const k=Math.floor(r/q);if(k){p.push([q===1e3&&k===1?"mil":ate999(k)+(q>1?" "+(k===1?s1:s2):""),k]);r%=q;}}
    return p.map(([t,k],i)=>i&&i===p.length-1&&(k<100||k%100===0)?"e "+t:t).join(" ");};
  const tot=Math.round((Number(v)||0)*100),re=Math.floor(tot/100),ce=tot%100;
  const redondo=re>=1e6&&re%1e6===0;
  const tr=re?inteiro(re)+(redondo?" de":"")+(re===1?" real":" reais"):"";
  const tc=ce?inteiro(ce)+(ce===1?" centavo":" centavos"):"";
  return tr&&tc?tr+" e "+tc:tr||tc||"zero real";
}
const mascDoc=d=>{const n=String(d||"").replace(/\D/g,"");return n.length===11?n.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"):n.length===14?n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5"):String(d||"");};

/* ---------- histórico de alterações ---------- */
let histFila=[],histTimer=null;
function comHistorico(db){
  const embrulha=(ref,path)=>{const[col,id]=String(path).split("/");if(col!=="lancamentos"&&col!=="fixas")return ref;
    return new Proxy(ref,{get(t,k){
      if(k==="set"||k==="update"||k==="delete")return async(...a)=>{const antes=col==="lancamentos"?S.L.get(id):S.F.get(id);const r=await t[k](...a);
        try{const depois=k==="delete"?null:k==="set"?a[0]:{...(antes||{}),...a[0]};registrar(k,col,id,antes,depois,a[0]);
          if(col==="lancamentos"&&((antes&&PRO_RE.test(antes.plano||""))||(depois&&PRO_RE.test(depois.plano||"")))&&(!antes||!depois||!!antes.pago!==!!depois.pago||antes.valor!==depois.valor||antes.pago!==depois.pago))espelharPro(id,depois);}catch(x){console.warn(x);}
        return r;};
      const v=t[k];return typeof v==="function"?v.bind(t):v;}});};
  return new Proxy(db,{get(t,k){
    if(k==="doc")return p=>embrulha(t.doc(p),p);
    if(k==="collection")return c=>{const cr=t.collection(c);return new Proxy(cr,{get(tt,kk){if(kk==="doc")return i=>{const r=tt.doc(i);return embrulha(r,r.path||(c+"/"+r.id));};const v=tt[kk];return typeof v==="function"?v.bind(tt):v;}});};
    const v=t[k];return typeof v==="function"?v.bind(t):v;}});
}
function registrar(k,col,id,antes,depois,patch){
  if(S.sistema||!S.canWrite)return;
  const x=depois||antes||{},inn=col==="lancamentos"&&isIn(x);let acao;
  if(col==="fixas")acao=k==="delete"?"excluiu a recorrente":!antes?"criou a recorrente":(patch&&patch.ativa===false&&antes.ativa!==false)?"pausou a recorrente":"editou a recorrente";
  else if(k==="delete")acao="excluiu";
  else if(!antes)acao="lançou";
  else if(patch&&patch.pago&&!antes.pago)acao=inn?"marcou como recebida":"marcou como paga";
  else if(patch&&"pago" in patch&&patch.pago===null&&antes.pago)acao="desfez o pagamento de";
  else acao="editou";
  histFila.push({acao,col,id,txt:(x.credor||"(sem nome)")+" · "+BRL.format(Number(x.valor)||0)});
  clearTimeout(histTimer);histTimer=setTimeout(gravarHist,1200);
}
async function gravarHist(){
  const fila=histFila;histFila=[];if(!fila.length||!S.db)return;
  const quem=window.FIN&&FIN.user?(FIN.nome||FIN.user.email):"Você",em=new Date().toISOString();
  const grupos=new Map();fila.forEach(f=>{const g=f.acao+"|"+f.col;if(!grupos.has(g))grupos.set(g,[]);grupos.get(g).push(f);});
  const linhas=[];grupos.forEach(fs=>{if(fs.length>3)linhas.push({acao:fs[0].acao,txt:fs.length+" "+(fs[0].col==="fixas"?"recorrentes":"contas"),ref:"",n:fs.length});else fs.forEach(f=>linhas.push({acao:f.acao,txt:f.txt,ref:f.col+"/"+f.id,n:1}));});

  return [...g.values()].map(d=>{const doc=(S.D&&S.D.get(d.k))||null,ab=d.ls.filter(l=>!l.pago).sort((a,b)=>a.venc.localeCompare(b.venc));
    const ref=d.ls[0],de=doc?doc.de:d.de;
    return {k:d.k,doc,ls:d.ls,ab,de,pagas:Math.max(0,de-ab.length),falta:ab.reduce((s,l)=>s+(Number(l.valor)||0),0),parcela:ab.length?Number(ab[0].valor)||0:0,prox:ab.length?ab[0].venc:"",fim:d.ls.reduce((m,l)=>l.venc>m?l.venc:m,""),
      nome:doc?doc.nome:(ref.credor||"Compra parcelada"),onde:doc?(doc.credor||""):(ref.cartao||ref.banco||""),cartao:!doc&&!!ref.cartao};})
    .filter(d=>d.ab.length).sort((a,b)=>b.falta-a.falta);
}

/* ---------- patrimônio: tela ---------- */
function patEm(fim){
  const base=cfg().contas.reduce((s,c)=>s+(Number(c.saldo)||0),0);
  const contas=base+live().filter(l=>l.pago&&l.pago<=fim).reduce((s,l)=>s+(Number(l.valor)||0)*(isIn(l)?1:-1),0);
  const inv=[...(S.I||new Map()).values()].reduce((s,i)=>{const h=(i.hist||[]).filter(x=>x.d<=fim);return s+(h.length?Number(h[h.length-1].v)||0:0);},0);
  const div=live().filter(l=>l.origem&&l.origem.t==="parcela"&&!isIn(l)&&(!l.pago||l.pago>fim)&&String(l.criado||"0000").slice(0,10)<=fim).reduce((s,l)=>s+(Number(l.valor)||0),0);
  return contas+inv-div;
}
function vPat(){
  const sd=saldos(),dv=dividas(),invs=[...(S.I||new Map()).entries()].sort((a,b)=>invAtual(b[1])-invAtual(a[1]));
  const tInv=invs.reduce((s,[,i])=>s+invAtual(i),0),tDiv=dv.reduce((s,d)=>s+d.falta,0),pat=sd.total+tInv-tDiv;
  // série de 12 meses
  const n=new Date(),t=today(),pts=[];
  for(let k=11;k>=0;k--){const[y,m]=addYM(n.getFullYear(),n.getMonth()+1,-k),fim=k?dateFor(y,m,31):t;pts.push({y,m,v:patEm(fim)});}
  const ini=[...live().map(l=>l.pago||"9999"),...[...(S.I||new Map()).values()].map(i=>((i.hist||[])[0]||{}).d||"9999")].reduce((a,b)=>b<a?b:a,"9999");
  const serie=pts.filter(p=>ymKey(p.y,p.m)>=ini.slice(0,7));
  const ant=serie.length>1?serie[serie.length-2].v:null,primeiro=serie.length>1?serie[0].v:null;
  const dMes=ant===null?"":`<b class="${pat-ant<0?"neg":""}">${pat-ant>=0?"+ ":"− "}${money(Math.abs(pat-ant))}</b> em relação a ${MESES[serie[serie.length-2].m-1]}`;
  const d12=primeiro&&primeiro>0&&serie.length>=3?` · <b class="${pat-primeiro<0?"neg":""}">${pat-primeiro>=0?"+ ":"− "}${Math.abs(Math.round((pat-primeiro)/primeiro*100))}%</b> desde ${MESES[serie[0].m-1]}`:"";
  let grafico;
  if(serie.length<2)grafico=`<div class="pchart"><div class="empty" style="padding:24px 8px"><b>O gráfico aparece a partir do segundo mês.</b>Cada fim de mês vira um ponto, com contas, investimentos e dívidas daquela data.</div></div>`;
  else{const W=900,H=150,vs=serie.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||Math.abs(mx)||1,lo=mn-sp*.15,hi=mx+sp*.1;
    const x=i=>8+i*(W-16)/(serie.length-1),yv=v=>H-8-(v-lo)/(hi-lo)*(H-16);
    const d=serie.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+yv(p.v).toFixed(1)).join(" ");
    grafico=`<div class="pchart"><div class="vals"><span>${MES3[serie[0].m-1]}: <b>${money(serie[0].v)}</b></span><span>Hoje: <b>${money(pat)}</b></span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Patrimônio mês a mês"><path d="${d} L${x(serie.length-1)} ${H} L${x(0)} ${H} Z" fill="color-mix(in srgb,var(--pos) 14%,transparent)"/><path d="${d}" fill="none" stroke="var(--pos)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div class="lbl">${serie.map(p=>`<span>${MES3[p.m-1]}</span>`).join("")}</div></div>`;}
  const mensal=dv.reduce((s,d)=>s+d.parcela,0);
  return `<section class="sec pat-hero"><div class="k">${T("Patrimônio da empresa hoje","Seu patrimônio hoje")}</div><div class="big">${amt(pat,pat<0?"− ":"")}</div>${dMes||d12?`<div class="d">${dMes}${d12}</div>`:""}</section>
  <div class="eq"><div><div class="k">Nas contas</div><div class="v">${money(sd.total)}</div><div class="s">${cfg().contas.length} conta${cfg().contas.length===1?"":"s"} bancária${cfg().contas.length===1?"":"s"}</div></div>
    <div><div class="k">+ Investimentos</div><div class="v">${money(tInv)}</div><div class="s">${invs.length} aplicaç${invs.length===1?"ão":"ões"}</div></div>
    <div><div class="k">− Dívidas</div><div class="v ${tDiv?"neg":""}">${money(tDiv)}</div><div class="s">${dv.length} dívida${dv.length===1?"":"s"}</div></div></div>
  <section class="sec"><div class="sec-h"><h2>Mês a mês</h2><p>${serie.length>1?"Últimos "+serie.length+" meses":""}</p></div>${grafico}</section>
  <section class="sec"><div class="sec-h"><div><h2>Dívidas e financiamentos</h2><p>${dv.length?`Saem ${money(mensal)} por mês · falta pagar ${money(tDiv)}`:"Compras parceladas aparecem aqui sozinhas"}</p></div>${S.canWrite?'<button class="btn small" data-act="novadivida">+ Dívida</button>':""}</div>
    ${dv.length?`<div class="dvs">${dv.map(dvCard).join("")}</div>`:`<div class="panel"><div class="empty"><b>Nenhuma dívida em aberto.</b>Financiamentos e empréstimos você cadastra em + Dívida. Compras parceladas entram sozinhas.</div></div>`}</section>
  <section class="sec"><div class="sec-h"><div><h2>Investimentos</h2><p>${invs.length?"Atualize o valor quando olhar o extrato":"Onde o dinheiro está aplicado"}</p></div>${S.canWrite?'<button class="btn small" data-act="novoinv">+ Investimento</button>':""}</div>
    ${invs.length?`<div class="panel">${invs.map(([id,i])=>invLinha(id,i)).join("")}</div>`:`<div class="panel"><div class="empty"><b>Nenhum investimento cadastrado.</b>Cadastre a poupança, o Tesouro, CDBs ou ações com o valor de hoje. Depois é só atualizar de vez em quando.</div></div>`}</section>`;

const mod10=n=>{let s=0,p=2;for(let i=n.length-1;i>=0;i--){let x=+n[i]*p;s+=x>9?x-9:x;p=p===2?1:2;}const r=s%10;return r?10-r:0;};

  }

const DIA_SEM=["domingo","segunda","terca","quarta","quinta","sexta","sabado"];
function interpretar(txt){

  let t=" "+normTxt(orig).replace(/r\$\s*/g,"")+" ";const r={orig};const tira=re=>{t=t.replace(re," ");};

  else if(/\samanha\s/.test(t)){d=new Date(hoje);d.setDate(d.getDate()+1);tira(/\samanha\s/);}
  else if(/\shoje\s/.test(t)){d=new Date(hoje);tira(/\shoje\s/);}
  else if(m=t.match(/\s(?:dia\s)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/)){let y=m[3]?+m[3]:hoje.getFullYear();if(y<100)y+=2000;d=new Date(y,+m[2]-1,+m[1]);tira(m[0]);}
  else if(m=t.match(/\sdia\s(\d{1,2})\s/)){d=new Date(hoje.getFullYear(),hoje.getMonth(),+m[1]);tira(m[0]);}
  else{const i=DIA_SEM.findIndex(w=>new RegExp("\\s(n?[ao]\\s)?"+w+"(-feira)?(\\spassad[ao])?\\s").test(t));if(i>=0){d=new Date(hoje);let k=(hoje.getDay()-i+7)%7;if(k===0)k=7;d.setDate(d.getDate()-k);tira(new RegExp("\\s(n?[ao]\\s)?"+DIA_SEM[i]+"(-feira)?(\\spassad[ao])?\\s"));}}
  r.data=iso(d||hoje);
  // valor
  m=t.match(/\s(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(\s?mil)?(?:\s?reais)?\s/);
  if(m){let v=m[1];v=v.includes(",")?v.replace(/\./g,"").replace(",","."):(/\.\d{3}$/.test(v)?v.replace(/\./g,""):v);r.val=Number(v)*(m[2]?1000:1);tira(m[0]);}
  // cartão, banco e forma
  const cs=cartoes(),bs=bancos();
  for(const c of cs){const k=normTxt(c);if(k&&t.includes(" "+k+" ")){r.cartao=c;tira(new RegExp("\\s(no\\s|na\\s)?(cartao\\s)?"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s"));}}
  if(!r.cartao&&/\s(cartao|credito|no credito|parcelado)\s/.test(t)&&cs.length){r.cartao=cs[0];}
  if(r.cartao)tira(/\s(no\s|na\s)?(cartao( de credito)?|credito|parcelado)\s/g);
  for(const b of bs){const k=normTxt(b);if(k&&t.includes(" "+k+" ")){r.banco=b;tira(new RegExp("\\s(no\\s|na\\s|pelo\\s|pela\\s|do\\s|da\\s)?"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s"));}}
  const FM=[[/\spix\s/,/pix/],[/\sboleto\s/,/boleto/],[/\s(debito|no debito)\s/,/debito/],[/\s(dinheiro|especie)\s/,/dinheiro/],[/\s(ted|transferencia)\s/,/transfer|ted/]];

async function libZip(){if(window.JSZip)return window.JSZip;await new Promise((ok,no)=>{const x=document.createElement("script");x.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";x.onload=ok;x.onerror=()=>no(new Error("lib"));document.head.appendChild(x);});if(!window.JSZip)throw new Error("lib");return window.JSZip;}
function planilhaMes(y,m){
  const k=ymKey(y,m),d=s=>s?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null;
  const ls=live().filter(l=>!isTr(l)&&(ymOf(l.venc)===k||(l.pago&&ymOf(l.pago)===k))).sort((a,b)=>(a.pago||a.venc).localeCompare(b.pago||b.venc));
  const rows=ls.map(l=>({"Vencimento":d(l.venc),"Pago / recebido em":d(l.pago),"Nome":l.credor||"","Categoria":l.plano||"","Tipo":isIn(l)?"Receita":"Despesa","Valor (R$)":Number(l.valor)||0,"Forma de pagamento":l.forma||"","Banco":l.banco||"","Cartão":l.cartao||"","Centro de custo":l.centro||"","Situação":status(l).txt,"Observação":l.obs||"","Anexos":(l.anexos||[]).length}));
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows.length?rows:[{}],{cellDates:true,dateNF:"dd/mm/yyyy"});
  ws["!cols"]=[12,14,30,26,9,13,18,18,16,18,14,32,8].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,"Lançamentos de "+MESES[m-1].slice(0,3));
  return {buf:XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true}),ls};
}
async function pacoteContador(btn){
  if(!downloads){toast("Baixar não está disponível nesta tela");return;}
  if(!window.XLSX){toast("A planilha não carregou. Confira a internet.");return;}
  const tx=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.textContent="Montando o pacote...";}
  try{
    const JZ=await libZip(),y=S.y,m=S.m,k=ymKey(y,m),pre=k+"_";
    const pdf=await baixarPDF(null,{buffer:true});
    const {buf,ls}=planilhaMes(y,m),zip=new JZ();
    zip.file(pre+"Relatorio.pdf",pdf);zip.file(pre+"Lancamentos.xlsx",buf);
    const limpa=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._ -]+/g,"").trim().replace(/\s+/g,"_").slice(0,50)||"arquivo";
    let n=0;const falhas=[],usados=new Set();
    for(const l of ls)for(const a of (l.anexos||[])){
      try{const u=await ANX.url(a.id),r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob();
        const ext=(String(a.nome||"").match(/\.[A-Za-z0-9]{2,4}$/)||[(b.type==="application/pdf"?".pdf":b.type==="image/png"?".png":".jpg")])[0];
        let nome=`${(l.pago||l.venc)}_${limpa(l.credor)}_${anxNome(a.k).toLowerCase()}`;let i=2;while(usados.has(nome))nome=nome.replace(/(_\d+)?$/,"_"+i++);usados.add(nome);
        zip.file("Comprovantes/"+nome+ext,b);n++;}catch(_){falhas.push(`${br(l.venc)} ${l.credor}: ${a.nome||anxNome(a.k)}`);}}
    const ent=ls.filter(isIn).reduce((s,l)=>s+(Number(l.valor)||0),0),sai=ls.filter(l=>!isIn(l)).reduce((s,l)=>s+(Number(l.valor)||0),0);
    const nomeEsp=(window.FIN&&FIN.empresa&&FIN.empresa.nome)||(($("#empNome")||{}).textContent)||"";
    zip.file("LEIA-ME.txt",[`Pacote de ${MESES[m-1]} de ${y}${nomeEsp?" - "+nomeEsp:""}`,`Gerado pelo Finance em ${br(today())}.`,"",`${pre}Relatorio.pdf: resumo do mês, categorias e lista de contas.`,`${pre}Lancamentos.xlsx: todas as contas que venceram ou foram pagas no mês (${ls.length}).`,`Comprovantes: ${n} arquivo(s) anexado(s) às contas do mês.`,"",`Entradas: ${BRL.format(ent)}`,`Saídas: ${BRL.format(sai)}`,...(falhas.length?["","Não foi possível incluir:",...falhas]:[])].join("\r\n"));
    const out=await zip.generateAsync({type:"arraybuffer",compression:"DEFLATE"});
    await downloads.save({filename:"Finance_contador_"+k+".zip",data:out});
    toast(`Pacote pronto: relatório, planilha e ${n} comprovante${n===1?"":"s"}${falhas.length?". "+falhas.length+" não puderam ser incluídos":""}`);
  }catch(x){console.warn(x);if(!(x&&x.code==="declined"))toast(x&&x.message==="lib"?"Não consegui carregar o gerador do pacote. Confira a internet.":"Não foi possível montar o pacote agora");}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=tx;}}
}

          const cc=car?(cfg().cartoes||[]).find(x=>x.nome===v("n_cartao"))||{}:{},cid=rid();

function parcPlan(sh){
  const g=id=>{const x=sh.querySelector("#"+id);return x?x.value.trim():"";};
  const tot=parseMoney(g("n_val")),np=parseInt(g("n_np"),10),venc=g("n_venc"),vp=parseMoney(g("n_vp"));
  const ini=Math.max(1,parseInt(g("n_ini"),10)||1);
  if(!(np>=1&&np<=60)||!venc||ini>np)return null;
  if(!(vp>0)&&!(tot>0))return null;
  const base=vp>0?r2(vp):r2(Math.floor(tot/np*100)/100);
  const y=+venc.slice(0,4),mm=+venc.slice(5,7),day=+venc.slice(8,10);
  const items=[];
  for(let n=ini;n<=np;n++){const[yy,m2]=addYM(y,mm,n-ini);
    const valor=vp>0?base:(n===np?r2(tot-base*(np-1)):base);
    items.push({n,venc:dateFor(yy,m2,day),valor});}
  return {np,items};
}
function writeErr(x){const c=x&&x.code;
  if(c==="invalid_argument")return "Você não tem permissão para alterar. Peça ao dono da empresa permissão para editar.";
  if(c==="quota_exceeded")return "O espaço de dados encheu. Avise o dono da empresa.";
  return "Não foi possível salvar agora. Confira a internet e tente de novo.";}

      ${ANX.up?`<label class="f full">Comprovante (opcional)<input type="file" id="p_anx" accept="image/*,application/pdf"><span class="help">Foto ou PDF. Pode anexar depois também.</span></label>`:""}

      catch(x){ok.disabled=false;ok.textContent="Confirmar";return err(sh,anxErr(x));}}
    const antes=S.L.get(id)||{},novos=(up.anexos||[]).filter(a=>!(antes.anexos||[]).some(b=>b.id===a.id));
    try{await S.db.doc("lancamentos/"+id).update(up);S.pagoAgora={id,t:Date.now()};close();render(true);
      toast(inn?"Recebimento registrado":"Pagamento registrado",{fn:async()=>{await S.db.doc("lancamentos/"+id).update({pago:null,valor:antes.valor,banco:antes.banco||"",anexos:antes.anexos||[]});novos.forEach(a=>ANX.del(a.id));}});}
    catch(x){ok.disabled=false;ok.textContent="Confirmar";err(sh,writeErr(x));}
  };});

  });

const h32=str=>{let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return (h>>>0).toString(36);};

  if(m=s.match(/^(\d{4})(\d{2})(\d{2})/))return `${m[1]}-${m[2]}-${m[3]}`;
  return null;}
function parseOFX(t){const out=[];

    const f=k=>{const m=b.match(new RegExp("<"+k+">([^<\\r\\n]*)","i"));return m?m[1].trim():"";};
    const data=parseDateBR(f("DTPOSTED")),valor=parseSigned(f("TRNAMT"));

    const memo=f("MEMO"),name=f("NAME");
    out.push({data,valor,desc:(memo&&name&&!memo.includes(name)?name+" "+memo:memo||name||f("TRNTYPE")).replace(/\s+/g," ").trim(),fitid:f("FITID")});});
  return out;}
function parseCSV(t){
  const lines=t.split(/\r?\n/).filter(l=>l.trim());const sample=lines.slice(0,10).join("\n");
  const cnt=c=>(sample.match(new RegExp(c==="\t"?"\t":"\\"+c,"g"))||[]).length;
  const delim=[";",",","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===delim){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);if(row.some(c=>c.trim()))rows.push(row.map(c=>c.trim()));row=[];cur="";}

function csvItems(){const I=S.imp,m=I.map;

    if(m.v>=0)valor=parseSigned(r[m.v]);else{const c=parseSigned(r[m.cr]),dd=parseSigned(r[m.db]);valor=(isNaN(c)?0:Math.abs(c))-(isNaN(dd)?0:Math.abs(dd));if(isNaN(c)&&isNaN(dd))valor=NaN;}

function destInfo(dest){const[t,...n]=String(dest).split(":");return {kind:t==="c"?"cartao":"banco",nome:n.join(":")};}

  if(k){const h=live().filter(l=>l.imp&&l.imp.k===k&&isIn(l)===entrada).sort((a,b)=>String(b.criado||"").localeCompare(String(a.criado||"")))[0]||live().find(l=>normDesc(l.credor)===k&&isIn(l)===entrada);
    if(h)sg={k,credor:h.credor,plano:h.plano,centro:h.centro||""};}
  const r=regraPara(desc+" "+sg.credor,entrada);

function buildReview(raw){
  const I=S.imp,{kind,nome}=destInfo(I.dest),used=new Set(),seen={};
  const items=raw.sort((a,b)=>a.data.localeCompare(b.data)).map(x=>{
    const base=I.dest+"|"+x.data+"|"+x.valor.toFixed(2)+"|"+x.desc+"|"+x.fitid;seen[base]=(seen[base]||0)+1;
    const id="im-"+h32(base+"|"+seen[base]),entrada=x.valor>0,abs=r2(Math.abs(x.valor)),sg=sugestao(x.desc,entrada);
    const it={...x,id,abs,entrada,k:sg.k,credor:sg.credor,plano:sg.plano,centro:sg.centro,regra:sg.regra||"",act:"nova",match:null,nota:""};
    if(S.L.has(id)){it.act="ignorar";it.nota="Já importada antes";return it;}
    const eq=l=>Math.abs((Number(l.valor)||0)-abs)<0.01&&isIn(l)===entrada&&!used.has(l.id);
    if(kind==="banco"&&!entrada){
      const cards=(cfg().cartoes||[]).slice().sort((a,b)=>(b.banco===nome)-(a.banco===nome));
      for(const c of cards){const op=live().filter(l=>l.cartao===c.nome&&!l.pago&&!isIn(l)&&!used.has(l.id)&&Math.abs(days(l.venc,x.data))<=12);

        if(g){g.forEach(l=>used.add(l.id));it.act="baixar";it.lista=g.map(l=>l.id);it.nota="Pagamento da fatura "+c.nome+": "+g.length+" compra(s) ficam pagas";return it;}}
      if(/fatura|cartao de credito|pagto cartao|pag cartao|pgto cartao/.test(normTxt(x.desc))){it.act="ignorar";it.nota="Parece pagamento de fatura de cartão. Ignorado para a despesa não contar duas vezes: as compras já ficam no cartão.";return it;}
    }

    [...out.lanc,...out.fixas].forEach(l=>{if(l.plano&&!temP.has(normTxt(l.plano))&&!out.planosNovos.some(p=>normTxt(p.nome)===normTxt(l.plano)))out.planosNovos.push({nome:l.plano,tipo:l.tipo||tipoP(l.plano)||"Saída"});});
    out.bancosNovos=out.bancos.filter(b=>!temB.has(normTxt(b.nome)));
    [...out.lanc,...out.fixas].forEach(l=>{if(l.banco&&!temB.has(normTxt(l.banco))&&!out.bancosNovos.some(b=>normTxt(b.nome)===normTxt(l.banco))&&!ehExemplo(l.banco))out.bancosNovos.push({nome:l.banco,saldo:0});});
    Object.assign(I,{step:"planilha",pl:out});render(true);
  }catch(x){console.warn(x);toast("Não consegui ler essa planilha. Confira se é o arquivo .xlsx certo.");}
}
function vPlanilha(){
  const P=S.imp.pl,novos=P.lanc.filter(l=>!l.ja),pagos=novos.filter(l=>l.pago).length,fxN=P.fixas.filter(f=>!f.ja);
  const linha=(t,v)=>`<div class="r"><span class="t">${t}</span><b class="num">${v}</b></div>`;
  return `<div class="card"><h3>Confira antes de importar</h3><p style="color:var(--muted);font-size:14px;margin:.3em 0 12px">${esc(P.file)}${P.abas&&P.abas.length?" · lido de "+(P.abas.length>1?P.abas.length+" abas: ":"")+P.abas.map(esc).join(", "):""}</p>${P.colunas?`<p class="hint" style="margin:-4px 0 12px">Colunas usadas: ${P.colunas.map(esc).join(", ")}.</p>`:""}
    <div class="panel rank">${linha("Lançamentos novos",novos.length+` <span class="muted" style="font-weight:400">(${pagos} pagos, ${novos.length-pagos} em aberto)</span>`)}${linha("Contas fixas que viram recorrentes",fxN.length)}${linha("Bancos novos",P.bancosNovos.length)}${linha("Categorias novas",P.planosNovos.length)}
      ${P.lanc.length-novos.length?linha("Já importados antes (ficam de fora)",P.lanc.length-novos.length):""}${P.exemplos?linha("Linhas de exemplo ignoradas",P.exemplos):""}${P.erros?linha("Linhas incompletas ignoradas (sem data ou valor)",P.erros):""}</div>
    ${P.bancosNovos.length?`<p class="hint" style="margin:12px 0 0">Bancos: ${P.bancosNovos.map(b=>esc(b.nome)+(b.saldo?" (saldo inicial "+money(b.saldo)+")":"")).join(", ")}.</p>`:""}
    ${fxN.length?`<p class="hint" style="margin:6px 0 0">As contas fixas começam no mês seguinte ao último lançamento delas na planilha, para nada entrar duas vezes.</p>`:""}
    ${novos.length?`<div class="list" style="margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden">${novos.slice(0,6).map(l=>`<div class="item" style="cursor:default"><div class="ic dt"><b>${l.venc.slice(8,10)}</b><small>${MES3[+l.venc.slice(5,7)-1]}</small></div><div class="who"><b>${esc(l.credor||"(sem nome)")}</b><span>${esc(l.plano)}</span></div><div class="st"><i class="dot"></i>${l.pago?"Pago "+br(l.pago):"Em aberto"}</div><div class="v num">${l.tipo==="Entrada"?"+ ":"− "}${money(l.valor)}</div><div></div></div>`).join("")}</div>${novos.length>6?`<p class="hint" style="margin:6px 0 0">E mais ${novos.length-6}.</p>`:""}`:""}
    <div class="actions" style="margin-top:14px"><button class="btn" data-act="imp-reset">Cancelar</button><button class="btn primary" data-act="pl-go" ${novos.length||fxN.length||P.bancosNovos.length||P.planosNovos.length?"":"disabled"}>Importar</button></div></div>`;
}
async function importarPlanilha(){
  const I=S.imp,P=I.pl;if(!P||I.busy)return;I.busy=true;const b=view.querySelector('[data-act="pl-go"]');if(b){b.disabled=true;b.textContent="Importando...";}
  try{
    const c=cfg(),formas=[...new Set([...(c.formas||[]),...P.formas])];
    await saveConfig({planos:[...c.planos,...P.planosNovos],contas:[...(c.contas||[]),...P.bancosNovos.map(x=>({...x,cor:tomDe(x.nome,"")}))],formas});
    const novos=P.lanc.filter(l=>!l.ja);let n=0;
    for(const l of novos){const{id,ja,...d}=l;await S.db.doc("lancamentos/"+id).set({...d,centro:"",cartao:"",origem:{t:"planilha"},criado:new Date().toISOString()});n++;if(b&&n%10===0)b.textContent="Importando "+n+" de "+novos.length+"...";}
    let nf=0;const cur=ymOf(today());
    for(const f of P.fixas.filter(x=>!x.ja)){
      const ult=P.lanc.filter(l=>normTxt(l.credor)===normTxt(f.credor)&&l.plano===f.plano).map(l=>ymOf(l.venc)).sort().pop();
      let inicio=cur;if(ult&&ult>=cur){const[y,m]=addYM(+ult.slice(0,4),+ult.slice(5,7),1);inicio=ymKey(y,m);}
      const{ja,...d}=f;await S.db.doc("fixas/"+rid()).set({...d,cartao:"",centro:"",inicio,criado:new Date().toISOString()});nf++;}
    I.res=`${n} lançamento(s), ${nf} recorrente(s), ${P.bancosNovos.length} banco(s) e ${P.planosNovos.length} categoria(s) entraram no app.`;I.step="planfeito";
  }catch(x){toast(writeErr(x));}
  I.busy=false;render(true);
}
async function importar(){
  const I=S.imp;if(I.busy)return;const{kind,nome}=destInfo(I.dest),cc=(cfg().cartoes||[]).find(x=>x.nome===nome)||{};
  const todo=I.items.filter(x=>x.act!=="ignorar");I.busy=true;let feitos=0,novas=0,baixas=0;
  const outro=e=>{const n=e?"Outras Receitas":"Outras Despesas";const p=cfg().planos;return p.some(x=>x.nome===n)?n:(p.find(x=>(x.tipo==="Entrada")===e)||{}).nome||n;};
  try{for(const x of todo){I.prog=(++feitos)+" de "+todo.length;const b=view.querySelector('[data-act="imp-go"]');if(b)b.textContent="Importando "+I.prog+"...";
      if(x.act==="baixar"&&x.lista){for(const id of x.lista)await S.db.doc("lancamentos/"+id).update({pago:x.data,banco:nome});baixas++;}
      else if(x.act==="baixar"&&x.match){await S.db.doc("lancamentos/"+x.match).update({pago:x.data,banco:nome,valor:x.abs});baixas++;}
      else if(x.act==="nova"){const plano=x.plano||outro(x.entrada);
        const docu={credor:(x.credor||titulo(x.desc)).trim(),plano,tipo:tipoDe(plano),valor:x.abs,centro:x.centro||"",obs:x.desc,origem:{t:"importado"},imp:{k:x.k,arq:I.file},criado:new Date().toISOString()};
        if(kind==="banco")Object.assign(docu,{venc:x.data,pago:x.data,banco:nome,cartao:"",forma:""});
        else Object.assign(docu,{venc:I.fat||x.data,pago:null,banco:cc.banco||"",cartao:nome,forma:"Cartão de Crédito",obs:x.desc+" (compra em "+br(x.data)+")"});
        await S.db.doc("lancamentos/"+x.id).set(docu);novas++;}}
    I.res=`${novas} lançamento(s) novo(s) e ${baixas} conta(s) baixada(s).`;I.step="done";
    const ult=I.items.reduce((m,x)=>x.data>m?x.data:m,"");
    if(ult){const campo=kind==="banco"?"contas":"cartoes",lst=(cfg()[campo]||[]).map(x=>x.nome===nome&&(!x.ultimo||x.ultimo<ult)?{...x,ultimo:ult}:x);try{await saveConfig({[campo]:lst});}catch(_){}}}
  catch(x){toast(writeErr(x));}
  I.busy=false;render(true);
}

/* ---------- exportar ---------- */
let downloads=null;
async function exportXlsx(){
  if(!downloads||!window.XLSX){toast("Baixar não está disponível nesta tela");return;}
  const d=s=>s?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null;
  const rows=live().sort((a,b)=>a.venc.localeCompare(b.venc)).map(l=>({"Vencimento":d(l.venc),"Credor / Cliente":l.credor,"Plano de Contas":l.plano,"Tipo":l.tipo,"Valor (R$)":Number(l.valor)||0,"Forma de Pagamento":l.forma||"","Conta / Banco":l.banco||"","Cartão":l.cartao||"","Centro de Custo":l.centro||"","Data do Pagamento / Recebimento":d(l.pago),"Situação":status(l).txt,"Observação":l.obs||"","Origem":l.origem&&l.origem.t==="fixa"?"Conta fixa":l.origem&&l.origem.t==="parcela"?`Parcela ${l.origem.n}/${l.origem.de}`:"Avulsa"}));
  const fx=[...S.F.values()].map(f=>({"Dia":f.dia,"Credor / Cliente":f.credor,"Plano de Contas":f.plano,"Valor (R$)":f.valor,"Forma de Pagamento":f.forma||"","Conta / Banco":f.banco||"","Cartão":f.cartao||"","Centro de Custo":f.centro||"","Ativa":f.ativa===false?"Não":"Sim"}));
  const sd=saldos();const bk=sd.res.map((r,i)=>({"Banco":r.nome,"Saldo inicial (R$)":Number(cfg().contas[i].saldo)||0,"Saldo hoje (R$)":r2(r.v)}));
  const wb=XLSX.utils.book_new();
